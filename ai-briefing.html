<!DOCTYPE html>
<html lang="ko"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#04050c">
  <title>실무자가 알아야 할 AI 현황 — 미쓰이물산 한국지사</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;family=Noto+Sans+KR:wght@300;400;500;700&amp;display=swap" rel="stylesheet">

  <style>
    :root {
      --hero-base:            #04050c;
      --heading:              #eef0f6;
      --body-muted:           #b9becf;
      --body-dim:             #8b91a6;
      --on-media:             #ffffff;
      --action-inverse:       #ffffff;
      --action-inverse-fg:    #2f2f33;
      --glass-fill:           rgba(255,255,255,0.08);
      --glass-soft:           rgba(255,255,255,0.045);
      --glass-border:         rgba(255,255,255,0.16);
      --glass-line:           rgba(255,255,255,0.10);
      --scrim:                rgba(4,5,12,0.46);
      --scrim-strong:         rgba(4,5,12,0.68);
      --scrim-soft:           rgba(4,5,12,0.12);
      --cyan:                 #7cc7ff;
      --violet:               #b39cff;
      --magenta:              #ff9ecb;
      --duration-fast:        150ms;
      --ease-entrance:        cubic-bezier(0.2, 0, 0, 1);
    }

    * { margin: 0; box-sizing: border-box; }

    html {
      /* 해상도와 무관하게 화면 대비 같은 비율로 보이도록 vw 기준.
         1440×810 에서 19.2px, 1920×1080 에서 25.6px — 기존 대비 +20%. */
      font-size: clamp(13px, 1.16vw, 26px);
      width: 100%;
      height: 100%;
      background: var(--hero-base);
    }

    @media (max-width: 1024px) { html { font-size: 1.66vw; } }
    @media (max-width: 640px)  { html { font-size: 3.9vw; } }

    body {
      height: 100%;
      overflow: hidden;
      background: var(--hero-base);
      color: var(--heading);
      font-family: "Onest", "Noto Sans KR", sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; text-decoration: none; }
    button { border: 0; padding: 0; font: inherit; cursor: pointer; background: none; color: inherit; }

    /* ── 유체 이펙트 레이어 : 표지 + 목차에서만 노출 ───────────────── */
    .fx-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 700ms var(--ease-entrance);
    }
    .fx-layer.is-live { opacity: 1; }

    .fluid-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .scrim {
      position: absolute;
      inset: 0;
      background: radial-gradient(115% 95% at 50% 46%,
        var(--scrim-strong) 0%, var(--scrim-strong) 24%,
        var(--scrim) 52%, var(--scrim-soft) 100%);
    }

    /* ── 덱 / 슬라이드 ─────────────────────────────────────────────── */
    .deck {
      position: fixed;
      inset: 0;
      z-index: 10;
      transition: opacity 400ms var(--ease-entrance), filter 400ms var(--ease-entrance);
    }
    .deck.is-veiled { opacity: 0; pointer-events: none; filter: blur(6px); }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2.2rem 4.2rem;
      background: var(--hero-base);
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(1.1rem);
      transition:
        opacity 520ms var(--ease-entrance),
        transform 520ms var(--ease-entrance),
        visibility 0ms linear 520ms;
    }
    .slide.is-active {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition-delay: 0ms, 0ms, 0ms;
    }
    .slide.cover { background: transparent; }

    /* ── 파트 간지 ─────────────────────────────────────────────────── */
    .slide.divider-slide {
      background:
        radial-gradient(60% 60% at 50% 38%, rgba(124,199,255,0.10) 0%, transparent 70%),
        var(--hero-base);
    }
    .divider-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 46rem;
      width: 100%;
      margin: 0 auto;
      position: relative;
    }
    .divider-num {
      position: absolute;
      top: -5.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11rem;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.04em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(124,199,255,0.18);
      pointer-events: none;
      z-index: 0;
      user-select: none;
    }
    .divider-kicker {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 1.3rem;
    }
    .divider-kicker::before, .divider-kicker::after {
      content: "";
      width: 2.2rem; height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan));
    }
    .divider-kicker::after { background: linear-gradient(90deg, var(--cyan), transparent); }
    .divider-title {
      position: relative;
      z-index: 1;
      font-size: 3.1rem;
      font-weight: 500;
      line-height: 1.14;
      letter-spacing: -0.02em;
      color: var(--heading);
      margin-bottom: 1.1rem;
    }
    .divider-title em { font-style: normal; color: var(--cyan); }
    .divider-teaser {
      position: relative;
      z-index: 1;
      font-size: 1.14rem;
      line-height: 1.6;
      color: var(--body-muted);
      max-width: 38rem;
      margin-bottom: 2rem;
    }
    .divider-bullets {
      position: relative;
      z-index: 1;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-bottom: 2.2rem;
    }
    .divider-bullets li {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      font-size: 1rem;
      color: var(--body-muted);
      counter-increment: dv;
    }
    .divider-bullets { counter-reset: dv; }
    .divider-bullets li::before {
      content: counter(dv, decimal-leading-zero);
      flex: 0 0 auto;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      color: var(--cyan);
      opacity: 0.85;
    }
    .divider-time {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      height: 2rem;
      padding: 0 1.1rem;
      border-radius: 9999px;
      border: 1px solid var(--glass-border);
      background: var(--glass-fill);
      font-size: 0.82rem;
      color: var(--body-dim);
      backdrop-filter: blur(10px);
    }
    @media (max-width: 1024px) {
      .divider-num { font-size: 7rem; top: -3.6rem; }
      .divider-title { font-size: 2.1rem; }
    }

    .slide-bg {
      position: absolute;
      inset: -2%;
      background-size: cover;
      background-position: center;
      filter: grayscale(0.4) saturate(0.75) contrast(1.05) brightness(0.9);
      opacity: 0;
      transform: scale(1.06);
      transition: opacity 1200ms var(--ease-entrance), transform 9s linear;
    }
    .is-active .slide-bg { opacity: 0.3; transform: scale(1); }

    .slide-veil {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(100deg, rgba(4,5,12,0.96) 0%, rgba(4,5,12,0.86) 42%, rgba(4,5,12,0.62) 100%),
        radial-gradient(120% 90% at 50% 50%, rgba(4,5,12,0.15) 0%, rgba(4,5,12,0.8) 100%);
    }

    .slide { contain: layout style; }
    .slide-inner {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 84rem;
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.18) transparent;
      padding-right: 0.25rem;
    }
    .slide-inner::-webkit-scrollbar { width: 5px; }
    .slide-inner::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 99px; }

    .is-active .slide-inner > * { animation: rise 620ms var(--ease-entrance) backwards; }
    .is-active .slide-inner > *:nth-child(1) { animation-delay: 60ms; }
    .is-active .slide-inner > *:nth-child(2) { animation-delay: 130ms; }
    .is-active .slide-inner > *:nth-child(3) { animation-delay: 200ms; }
    .is-active .slide-inner > *:nth-child(4) { animation-delay: 265ms; }
    .is-active .slide-inner > *:nth-child(5) { animation-delay: 325ms; }
    .is-active .slide-inner > *:nth-child(6) { animation-delay: 380ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(1.1rem); } to { opacity: 1; transform: none; } }

    /* split layout */
    .slide-inner.is-split {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 3rem;
      align-items: center;
    }
    .col-fig {
      position: relative;
      border-radius: 1.1rem;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      background: var(--glass-soft);
    }
    .col-fig img {
      display: block;
      width: 100%;
      height: 20rem;
      object-fit: cover;
      filter: grayscale(0.35) saturate(0.8) contrast(1.05);
    }
    .col-fig figcaption {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 1.4rem 1.2rem 0.95rem;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      color: var(--body-muted);
      background: linear-gradient(180deg, rgba(4,5,12,0) 0%, rgba(4,5,12,0.92) 62%);
    }


    /* ── 실사진 패널 ────────────────────────────────────────────────
       각 슬라이드의 img 슬롯은 사용자가 편집 모드에서 직접 업로드하는
       고화질 실사진으로 채워진다. 업로드 전에는 빈 플레이스홀더로 남는다. */
    .photo-host {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(124,199,255,0.10), transparent 35%),
        radial-gradient(circle at 70% 30%, rgba(179,156,255,0.08), transparent 28%),
        #050812;
    }
    .photo-panel {
      width: 100%;
      height: 20rem;
      min-height: 15rem;
    }
    /* bg 모드에서는 호스트 자체가 슬라이드 전체(inset:0)와 정확히 맞아야
       업로드/삭제 버튼이 화면 안쪽에 위치한다. 살짝 확대해 천천히 줌아웃
       하는 효과는 별도의 내부 .photo-frame 레이어에만 적용한다.
       (photo-bg 자체에는 opacity(1이 아닌 값)를 주지 않는다 — opacity!=1 은
       새 stacking context 를 만들어 버튼의 z-index 가 slide-veil 아래로
       갇히기 때문이다.) */
    .photo-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .photo-frame {
      position: absolute;
      inset: -2%;
      transform: scale(1.06);
      transition: transform 9s linear;
      filter: saturate(0.92) contrast(1.03);
    }
    .is-active .photo-bg .photo-frame { transform: scale(1); }
    .photo-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      opacity: 0;
      transition: opacity 500ms var(--ease-entrance);
    }
    .photo-panel.has-photo .photo-img { opacity: 1; }
    .photo-bg .photo-img { transition: opacity 1200ms var(--ease-entrance); }
    .is-active .photo-bg.has-photo .photo-img { opacity: 0.34; }
    .photo-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(4,5,12,0.04), rgba(4,5,12,0.18)),
        radial-gradient(70% 60% at 50% 42%, transparent 35%, rgba(3,5,11,0.42) 100%);
    }
    .photo-placeholder {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: none;
      align-items: center;
      justify-content: center;
      color: rgba(225,232,245,0.3);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-align: center;
      padding: 1rem;
    }
    .is-editing .photo-placeholder { display: flex; }
    .has-photo .photo-placeholder { display: none; }
    .photo-upload-btn {
      position: absolute;
      z-index: 5;
      right: 0.7rem;
      top: 0.65rem;
      display: none;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(4,7,14,0.68);
      color: rgba(238,242,250,0.92);
      font-size: 0.68rem;
      letter-spacing: 0.03em;
      backdrop-filter: blur(9px);
      pointer-events: auto;
      cursor: pointer;
    }
    .photo-upload-btn:hover { background: rgba(124,199,255,0.28); border-color: rgba(124,199,255,0.5); }
    .is-editing .photo-upload-btn { display: inline-flex; }
    .photo-remove-btn {
      position: absolute;
      z-index: 5;
      right: 0.7rem;
      top: 2.55rem;
      display: none;
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(255,120,120,0.3);
      background: rgba(20,4,4,0.6);
      color: rgba(255,180,180,0.92);
      font-size: 0.68rem;
      backdrop-filter: blur(9px);
      cursor: pointer;
      pointer-events: auto;
    }
    .photo-remove-btn:hover { background: rgba(255,90,90,0.28); }
    .is-editing .photo-host.has-photo .photo-remove-btn { display: inline-flex; }

    /* bg 모드는 슬라이드 전체를 덮으므로, 버튼을 상단바/하단바와 겹치지
       않는 위치로 내린다 */
    .photo-bg .photo-upload-btn { top: auto; bottom: 5.4rem; }
    .photo-bg .photo-remove-btn { top: auto; bottom: 3.3rem; }
    @media (max-width: 1024px) {
      .photo-panel { height: 15rem; }
    }

    /* ── 편집 스탬프 — 이 슬라이드가 언제 · 누구에 의해 수정됐는지 ─── */
    .edit-stamp {
      position: absolute;
      right: 1.3rem;
      top: 4.6rem;
      z-index: 20;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #ff5a6a;
      background: rgba(20,4,6,0.55);
      border: 1px solid rgba(255,90,106,0.4);
      border-radius: 999px;
      padding: 0.28rem 0.65rem;
      pointer-events: none;
      white-space: nowrap;
    }
    .slide.cover .edit-stamp { top: 4.6rem; right: 1.8rem; }

    /* ── 타이포 / 블록 ─────────────────────────────────────────────── */
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 0.9rem;
    }
    .kicker::before {
      content: "";
      width: 1.6rem; height: 1px;
      background: linear-gradient(90deg, var(--cyan), transparent);
    }

    .s-title {
      font-size: 2.7rem;
      font-weight: 500;
      line-height: 1.16;
      letter-spacing: -0.02em;
      margin-bottom: 0.9rem;
    }
    .s-title em { font-style: normal; color: var(--cyan); }

    .lead {
      font-size: 1.12rem;
      line-height: 1.6;
      color: var(--body-muted);
      max-width: 58rem;
      margin-bottom: 1.7rem;
    }

    .quote {
      border-left: 2px solid var(--violet);
      padding: 0.35rem 0 0.35rem 1.2rem;
      font-size: 1.25rem;
      line-height: 1.55;
      color: var(--heading);
      margin: 1.4rem 0;
      max-width: 60rem;
    }
    .quote small { display: block; margin-top: 0.5rem; font-size: 0.88rem; color: var(--body-dim); }

    .grid { display: grid; gap: 1rem; }
    .g2 { grid-template-columns: repeat(2, 1fr); }
    .g3 { grid-template-columns: repeat(3, 1fr); }
    .g4 { grid-template-columns: repeat(4, 1fr); }
    .g5 { grid-template-columns: repeat(5, 1fr); }

    .card {
      border: 1px solid var(--glass-line);
      background: var(--glass-soft);
      border-radius: 0.9rem;
      padding: 1.15rem 1.25rem 1.25rem;
    }
    .card h4 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.005em;
      margin-bottom: 0.65rem;
      color: var(--heading);
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }
    .card h4 b {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--violet);
    }
    .card ul { list-style: none; padding: 0; }
    .card li {
      position: relative;
      padding-left: 0.78rem;
      font-size: 0.93rem;
      line-height: 1.7;
      color: var(--body-muted);
    }
    .card li::before {
      content: "";
      position: absolute;
      left: 0; top: 0.72em;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
    }
    .card p { font-size: 0.93rem; line-height: 1.66; color: var(--body-muted); }

    .card.accent-c { border-color: rgba(124,199,255,0.3); background: rgba(124,199,255,0.055); }
    .card.accent-v { border-color: rgba(179,156,255,0.3); background: rgba(179,156,255,0.055); }
    .card.accent-m { border-color: rgba(255,158,203,0.28); background: rgba(255,158,203,0.05); }
    .card.accent-c h4 b { color: var(--cyan); }
    .card.accent-m h4 b { color: var(--magenta); }

    .chips { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-bottom: 1.4rem; }
    .chip {
      border: 1px solid var(--glass-border);
      background: var(--glass-fill);
      border-radius: 99px;
      padding: 0.48rem 1rem;
      font-size: 0.9rem;
      color: var(--body-muted);
    }

    .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin: 0.65rem 0 1.35rem; }
    .flow span {
      border: 1px solid var(--glass-line);
      background: var(--glass-soft);
      border-radius: 0.5rem;
      padding: 0.48rem 0.9rem;
      font-size: 0.9rem;
      color: var(--heading);
      white-space: nowrap;
    }
    .flow span:last-child { border-color: rgba(124,199,255,0.4); color: var(--cyan); }
    .flow span:not(:last-child)::after {
      content: "→";
      display: inline-block;
      margin: 0 -0.35rem 0 0.7rem;
      color: var(--body-dim);
    }

    .steps { list-style: none; padding: 0; counter-reset: st; display: grid; gap: 0.5rem; }
    .steps.two { grid-template-columns: 1fr 1fr; column-gap: 1.8rem; }
    .steps li {
      counter-increment: st;
      display: flex;
      gap: 0.8rem;
      align-items: baseline;
      font-size: 0.97rem;
      line-height: 1.6;
      color: var(--body-muted);
    }
    .steps li::before {
      content: counter(st, decimal-leading-zero);
      flex: 0 0 auto;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--cyan);
      opacity: 0.85;
    }
    .steps li b { color: var(--heading); font-weight: 500; }

    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    thead th {
      text-align: left;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--body-dim);
      padding: 0 0.7rem 0.6rem;
      border-bottom: 1px solid var(--glass-border);
      white-space: nowrap;
    }
    tbody td {
      padding: 0.66rem 0.75rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: var(--body-muted);
      line-height: 1.5;
      vertical-align: top;
    }
    tbody tr td:first-child { color: var(--heading); font-weight: 500; white-space: nowrap; }
    tbody tr:hover td { background: rgba(255,255,255,0.025); }
    .t-num { text-align: right; font-variant-numeric: tabular-nums; }

    .bars { display: grid; gap: 0.65rem; }
    .bar { display: grid; grid-template-columns: 14rem 1fr 2.8rem; align-items: center; gap: 1rem; }
    .bar span { font-size: 0.93rem; color: var(--body-muted); }
    .bar .bar-v { text-align: right; font-variant-numeric: tabular-nums; color: var(--heading); font-size: 0.87rem; }
    .bar-t { height: 6px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .bar-t i {
      display: block; height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      transform-origin: left;
      animation: grow 900ms var(--ease-entrance) both 260ms;
    }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .dots { display: inline-flex; gap: 3px; }
    .dots i { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.15); }
    .dots i.on { background: var(--cyan); }

    .era {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.9rem;
      position: relative;
      padding-top: 1.6rem;
    }
    .era::before {
      content: "";
      position: absolute; top: 0.55rem; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, rgba(124,199,255,0.15), rgba(179,156,255,0.55), rgba(255,158,203,0.35));
    }
    .era > div { position: relative; }
    .era > div::before {
      content: "";
      position: absolute; top: -1.32rem; left: 0.9rem;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--hero-base);
      border: 1.5px solid var(--violet);
    }
    .era .yr { font-size: 1.75rem; font-weight: 500; letter-spacing: -0.02em; }
    .era .tg { font-size: 0.76rem; letter-spacing: 0.16em; color: var(--cyan); margin: 0.15rem 0 0.6rem; }
    .era p { font-size: 0.88rem; line-height: 1.55; color: var(--body-muted); }
    .era p b { color: var(--heading); font-weight: 500; }

    /* 전망 구간 — 사실이 아니라 Scenario임을 시각적으로 구분 */
    .era.is-forecast::before {
      background: linear-gradient(90deg, rgba(179,156,255,0.4), rgba(255,158,203,0.35), rgba(255,255,255,0.06));
    }
    .era.is-forecast > div::before { border-color: var(--magenta); border-style: dashed; }
    .era.is-forecast .yr { color: var(--body-muted); }
    .era.is-forecast .tg { color: var(--magenta); }

    .era-label {
      display: flex; align-items: center; gap: 0.7rem;
      font-size: 0.76rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--body-dim);
      margin: 1.25rem 0 0;
    }
    .era-label::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.09); }
    .era-label b { color: var(--heading); font-weight: 500; letter-spacing: 0.06em; }

    .kv { display: grid; grid-template-columns: auto 1fr; gap: 0.45rem 1.3rem; font-size: 0.95rem; }
    .kv dt { color: var(--body-dim); white-space: nowrap; }
    .kv dd { color: var(--heading); margin: 0; line-height: 1.55; }

    .note { font-size: 0.83rem; color: var(--body-dim); margin-top: 1.05rem; line-height: 1.6; }

    /* 하루 일과 타임라인 */
    .day { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.62rem; position: relative; }
    .day::before {
      content: "";
      position: absolute; left: 2px; top: 0.5rem; bottom: 0.5rem;
      width: 1px;
      background: linear-gradient(180deg, rgba(124,199,255,0.5), rgba(179,156,255,0.35), transparent);
    }
    .day li {
      display: grid;
      grid-template-columns: 4.4rem 1fr;
      gap: 1.15rem;
      align-items: baseline;
      position: relative;
      padding-left: 1.3rem;
    }
    .day li::before {
      content: "";
      position: absolute; left: 0; top: 0.55em;
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--cyan);
    }
    .day time { font-size: 0.9rem; color: var(--cyan); font-variant-numeric: tabular-nums; letter-spacing: 0.03em; }
    .day li > div > b { display: block; font-weight: 500; color: var(--heading); font-size: 1rem; line-height: 1.4; }
    .day span { display: block; font-size: 0.9rem; color: var(--body-muted); line-height: 1.6; margin-top: 0.12rem; }
    .day span b { display: inline; font-weight: 500; color: var(--heading); }

    /* 통계 타일 */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    .stat {
      border: 1px solid var(--glass-line);
      background: var(--glass-soft);
      border-radius: 0.9rem;
      padding: 1.2rem 1.2rem 1.1rem;
    }
    .stat .n {
      font-size: 2.8rem; font-weight: 500; letter-spacing: -0.03em; line-height: 1;
      color: var(--heading); font-variant-numeric: tabular-nums;
    }
    .stat .n small { font-size: 1.25rem; margin-left: 0.08rem; color: var(--body-muted); }
    .stat .l { font-size: 0.98rem; color: var(--heading); margin-top: 0.65rem; line-height: 1.4; }
    .stat .d { font-size: 0.85rem; color: var(--body-muted); margin-top: 0.32rem; line-height: 1.5; }
    .stat.hi { border-color: rgba(124,199,255,0.35); background: rgba(124,199,255,0.06); }
    .stat.hi .n { color: var(--cyan); }
    .stat.warn { border-color: rgba(255,158,203,0.32); background: rgba(255,158,203,0.05); }
    .stat.warn .n { color: var(--magenta); }

    /* 도입 → 확산 깔때기 */
    .funnel { display: grid; gap: 0.55rem; }
    .fn-row { display: grid; grid-template-columns: 5.2rem 1fr; gap: 1.1rem; align-items: center; }
    .fn-row .fn-v {
      font-size: 1.45rem; font-weight: 500; text-align: right;
      color: var(--heading); font-variant-numeric: tabular-nums;
    }
    .fn-bar {
      position: relative; height: 2.5rem; border-radius: 0.5rem;
      background: rgba(255,255,255,0.05); display: flex; align-items: center; overflow: hidden;
    }
    .fn-bar i {
      position: absolute; top: 0; bottom: 0; left: 0;
      border-radius: 0.5rem;
      background: linear-gradient(90deg, rgba(124,199,255,0.4), rgba(179,156,255,0.18));
      transform-origin: left;
      animation: grow 900ms var(--ease-entrance) both 220ms;
    }
    .fn-bar span { position: relative; padding: 0 1rem; font-size: 0.94rem; color: var(--heading); }
    .fn-row.last .fn-v { color: var(--magenta); }
    .fn-row.last .fn-bar i { background: linear-gradient(90deg, rgba(255,158,203,0.45), rgba(255,158,203,0.12)); }

    .src { font-size: 0.79rem; color: var(--body-dim); margin-top: 1.05rem; line-height: 1.65; }
    .src b { color: var(--body-muted); font-weight: 400; }

    /* 법령 위계 ↔ 문서 위계 사다리 */
    .ladder { display: grid; gap: 0.5rem; }
    .ladder-row {
      display: grid;
      grid-template-columns: 7.5rem 1fr 17rem;
      gap: 1.2rem;
      align-items: center;
      padding: 0.7rem 1rem;
      border: 1px solid var(--glass-line);
      border-left: 2px solid var(--glass-border);
      border-radius: 0.6rem;
      background: var(--glass-soft);
    }
    .ladder-row .lv {
      display: flex; align-items: baseline; gap: 0.5rem;
      font-size: 0.98rem; font-weight: 500; color: var(--heading);
      white-space: nowrap;
    }
    .ladder-row .lv i { font-style: normal; font-size: 0.7rem; letter-spacing: 0.1em; color: var(--body-dim); }
    .ladder-row .ds { font-size: 0.9rem; line-height: 1.5; color: var(--body-muted); }
    .ladder-row .ds b { color: var(--heading); font-weight: 500; }
    .ladder-row .pt {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem; color: var(--cyan);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ladder-row.l1 { border-left-color: var(--cyan); }
    .ladder-row.l2 { border-left-color: var(--violet); }
    .ladder-row.l3 { border-left-color: var(--magenta); }
    .ladder-row.l4 { border-left-color: rgba(255,255,255,0.3); }
    .ladder-row.l5 { border-left-color: rgba(255,255,255,0.18); }

    /* 폴더 트리 */
    .tree { display: grid; gap: 0.1rem; }
    .tree-row { display: grid; grid-template-columns: 27rem 1fr; gap: 1.2rem; align-items: baseline; }
    .tree-row code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      white-space: pre;
      color: var(--body-muted);
    }
    .tree-row code b { color: var(--heading); font-weight: 500; }
    .tree-row code u { text-decoration: none; color: var(--cyan); }
    .tree-row em {
      font-style: normal;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--body-dim);
    }
    .tree-row em b { color: var(--violet); font-weight: 500; }
    /* 계층 사이 여백 줄 — 높이만 살짝 준다 */
    .tree-row.sp code, .tree-row.sp em { line-height: 0.7; }

    /* 강사 소개 */
    .bio { display: grid; grid-template-columns: 0.88fr 1.32fr; gap: 1.85rem; align-items: stretch; }
    .bio-profile { min-width: 0; display: flex; flex-direction: column; }
    .bio-content { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .bio-name { font-size: 2.6rem; font-weight: 500; letter-spacing: -0.025em; line-height: 1.1; }
    .bio-name small { display: block; font-size: 1rem; font-weight: 400; letter-spacing: 0.08em; color: var(--cyan); margin-top: 0.5rem; }
    .bio-role { font-size: 1.05rem; color: var(--body-muted); line-height: 1.6; margin: 0.8rem 0 1.05rem; }

    /* 강사 흑백 프로필 1장 — HTML 내부 Base64 임베딩, 외부 이미지 파일 불필요 */
    .bio-photos {
      display: block;
      width: 100%;
      height: 39.5rem;
      margin: 0;
    }
    .bio-photo {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      overflow: hidden;
      border-radius: 0;
      border: none;
      background: transparent;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }
    .bio-photo::after {
      display: none;
    }
    .bio-photo img {
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: contain;
      object-position: center top;
      filter: grayscale(1) contrast(1.035);
      transition: transform 700ms var(--ease-entrance), filter 700ms var(--ease-entrance);
    }
    .slide.is-active .bio-photo:hover img { transform: scale(1.025); filter: grayscale(1) contrast(1.06); }
    .bio-aside {
      padding: 0.95rem 1rem 1rem;
      border-radius: 1rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.035));
    }
    .bio-aside-kicker {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 0.55rem;
    }
    .bio-facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.55rem;
    }
    .bio-fact {
      padding: 0.7rem 0.8rem;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 0.85rem;
      background: rgba(10,12,22,0.32);
      min-height: 4.35rem;
    }
    .bio-fact strong {
      display: block;
      font-size: 0.94rem;
      color: var(--heading);
      margin-bottom: 0.32rem;
      letter-spacing: -0.01em;
    }
    .bio-fact span {
      display: block;
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--body-muted);
    }

    /* Slide 18: layered visual graphic */
    .layer-visual {
      position: relative;
      min-height: 25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1rem 0.35rem 0.6rem;
      background:
        radial-gradient(circle at 50% 0%, rgba(120, 215, 255, 0.10), transparent 34%),
        linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015));
    }
    .layer-visual::before {
      content: "";
      position: absolute;
      inset: 0.85rem 0.45rem auto 0.45rem;
      height: 5rem;
      border-radius: 1.1rem;
      background: radial-gradient(circle at 50% 50%, rgba(195, 236, 255, 0.12), transparent 70%);
      pointer-events: none;
      filter: blur(8px);
    }
    .layer-stack-graphic {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
    }
    .layer-band {
      position: relative;
      display: grid;
      grid-template-columns: 2.2rem 1fr;
      gap: 0.8rem;
      align-items: center;
      min-height: 3.42rem;
      padding: 0.78rem 1rem 0.72rem;
      border-radius: 1rem;
      border: 1px solid rgba(255,255,255,0.11);
      background: linear-gradient(180deg, rgba(227,241,255,0.12), rgba(10,14,24,0.72));
      clip-path: polygon(5% 0, 95% 0, 100% 100%, 0 100%);
      box-shadow: 0 12px 24px rgba(0,0,0,0.18);
      overflow: hidden;
    }
    .layer-band::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 46%;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent);
      pointer-events: none;
    }
    .layer-band.lv1 { width: 62%; }
    .layer-band.lv2 { width: 72%; }
    .layer-band.lv3 { width: 82%; }
    .layer-band.lv4 { width: 91%; }
    .layer-band.lv5 { width: 100%; }
    .layer-band-step {
      position: relative;
      z-index: 1;
      width: 1.6rem;
      height: 1.6rem;
      display: grid;
      place-items: center;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #07121d;
      background: linear-gradient(180deg, #eef9ff, #a2ebff);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.18);
    }
    .layer-band-copy {
      position: relative;
      z-index: 1;
      display: block;
    }
    .layer-band-copy b {
      display: block;
      color: var(--heading);
      font-size: 0.92rem;
      line-height: 1.15;
      margin-bottom: 0.12rem;
    }
    .layer-band-copy small {
      display: block;
      color: var(--body-muted);
      font-size: 0.73rem;
      line-height: 1.35;
    }
    .layer-band.tone-a { background: linear-gradient(180deg, rgba(182,231,255,0.16), rgba(10,14,24,0.74)); }
    .layer-band.tone-b { background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(10,14,24,0.74)); }
    .layer-band.tone-c { background: linear-gradient(180deg, rgba(160,210,255,0.16), rgba(10,14,24,0.74)); }
    .layer-graphic-note {
      position: relative;
      z-index: 1;
      margin-top: 0.85rem;
      padding: 0.9rem 1rem;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 0.95rem;
      background: rgba(9,12,22,0.34);
    }
    .layer-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 0.62rem;
    }
    .layer-badge {
      padding: 0.38rem 0.65rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      color: var(--body-muted);
      font-size: 0.71rem;
      line-height: 1.2;
    }
    .layer-graphic-note p {
      margin: 0;
      font-size: 0.81rem;
      line-height: 1.55;
      color: var(--body);
    }

    .tool-atlas {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.9rem;
    }
    .tool-section {
      padding: 0.9rem 0.95rem;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 1rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
      box-shadow: 0 10px 24px rgba(0,0,0,0.16);
    }
    .tool-section h4 {
      margin: 0 0 0.72rem;
      font-size: 0.98rem;
      color: var(--heading);
      letter-spacing: -0.01em;
    }
    .tool-tiles {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.56rem;
    }
    .tool-tile {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      min-width: 0;
      padding: 0.62rem 0.68rem;
      border-radius: 0.88rem;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(8, 12, 24, 0.52);
    }
    .tool-logo {
      flex: 0 0 2.05rem;
      width: 2.05rem;
      height: 2.05rem;
      display: grid;
      place-items: center;
      border-radius: 0.68rem;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #04111d;
      background: linear-gradient(180deg, color-mix(in srgb, var(--tool, #98d8ff) 96%, white 4%), color-mix(in srgb, var(--tool, #98d8ff) 76%, #062235 24%));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22), 0 8px 18px color-mix(in srgb, var(--tool, #98d8ff) 28%, transparent 72%);
    }
    .tool-meta { min-width: 0; }
    .tool-meta b {
      display: block;
      color: var(--heading);
      font-size: 0.84rem;
      line-height: 1.18;
      margin-bottom: 0.14rem;
    }
    .tool-meta small {
      display: block;
      color: var(--body-muted);
      font-size: 0.71rem;
      line-height: 1.32;
    }

    /* 행이 많은 슬라이드용 밀도 조정 */
    .compact tbody td { padding: 0.44rem 0.7rem; }
    .compact .quote { margin: 0.9rem 0 0.2rem; font-size: 1.08rem; }
    .compact .lead { margin-bottom: 1.15rem; }
    .compact .day { gap: 0.42rem; }
    .compact .day li > div > b { font-size: 0.95rem; }
    .compact .day span { font-size: 0.87rem; line-height: 1.5; }
    .compact .card { padding: 0.95rem 1.1rem 1rem; }
    .compact .card li { line-height: 1.6; }
    .compact .grid { gap: 0.8rem; }
    .compact .note { margin-top: 0.8rem; }

    /* 내용이 적은 슬라이드용 — 카드를 키워 여백을 줄인다 */
    .roomy .grid { gap: 1.2rem; }
    .roomy .card { padding: 1.5rem 1.6rem 1.6rem; }
    .roomy .card h4 { font-size: 1.18rem; margin-bottom: 0.85rem; }
    .roomy .card h4 b { font-size: 0.8rem; }
    .roomy .card p { font-size: 1.06rem; line-height: 1.75; }
    .roomy .card li { font-size: 1.06rem; line-height: 1.85; padding-left: 0.9rem; }
    .roomy .chip { font-size: 1.02rem; padding: 0.58rem 1.15rem; }
    .roomy .chips { gap: 0.65rem; margin-bottom: 1.7rem; }
    .roomy .quote { font-size: 1.4rem; }
    .roomy .flow span { font-size: 1rem; padding: 0.56rem 1.05rem; }

    /* ── 표지 ──────────────────────────────────────────────────────── */
    .cover .slide-inner { max-width: 58rem; text-align: center; overflow: visible; }
    .cover .slide-inner > * { animation: none !important; }

    .cover .lockup-lg {
      position: relative;
      padding-bottom: 1.6rem;
      margin-bottom: 1.7rem;
      opacity: 0;
      transform: translateY(1rem);
      transition: opacity 700ms var(--ease-entrance) 120ms, transform 700ms var(--ease-entrance) 120ms;
    }
    .cover .lockup-lg::after {
      content: "";
      position: absolute; left: 50%; bottom: 0;
      transform: translateX(-50%);
      width: 7rem; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    }
    .cover.is-ready .lockup-lg { opacity: 1; transform: none; }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 9999px;
      border: 1px solid var(--glass-border);
      background: var(--glass-fill);
      padding: 0.42rem 0.95rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--body-muted);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      transform: translateY(1.25rem);
      transition: opacity 700ms var(--ease-entrance) 260ms, transform 700ms var(--ease-entrance) 260ms;
    }
    .cover.is-ready .badge { opacity: 1; transform: none; }

    .cover h1 {
      margin: 1.2rem auto 0;
      max-width: 50rem;
      font-size: 3.5rem;
      font-weight: 500;
      line-height: 1.12;
      letter-spacing: -0.03em;
    }
    .cover .subline {
      margin: 1.3rem auto 0;
      max-width: 36rem;
      font-size: 1.08rem;
      line-height: 1.6;
      color: var(--body-muted);
    }
    .word { display: inline-block; opacity: 0; will-change: transform, opacity; }
    .cover h1 .word {
      transform: translateY(26px);
      transition: opacity 720ms cubic-bezier(0.215,0.61,0.355,1), transform 720ms cubic-bezier(0.215,0.61,0.355,1);
    }
    .cover .subline .word {
      transform: translateY(14px);
      transition: opacity 600ms cubic-bezier(0.215,0.61,0.355,1), transform 600ms cubic-bezier(0.215,0.61,0.355,1);
    }
    .cover.is-ready .word { opacity: 1; transform: none; }

    .cta-row {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      gap: 0.7rem;
      opacity: 0;
      transform: translateY(1.25rem);
      transition: opacity 700ms var(--ease-entrance) 1400ms, transform 700ms var(--ease-entrance) 1400ms;
    }
    .cover.is-ready .cta-row { opacity: 1; transform: none; }

    .pill-button {
      display: inline-flex;
      align-items: center;

       워드마크가 자동으로 실제 로고 이미지로 교체된다.

    .counter { font-size: 0.78rem; color: var(--body-dim); font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }

    .nav-cluster { display: flex; align-items: center; gap: 0.5rem; }
    .nav-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      height: 2.2rem; padding: 0 1rem;

    .hint { font-size: 0.72rem; color: var(--body-dim); letter-spacing: 0.02em; }
    .hint kbd {
      display: inline-block;

    /* ── 목차 ──────────────────────────────────────────────────────── */
    .toc {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: flex;
      flex-direction: column;

      transition: opacity 420ms var(--ease-entrance), visibility 0ms linear 420ms;

    .toc.is-open { opacity: 1; visibility: visible; transition-delay: 0ms, 0ms; }

    .toc-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 1.6rem; }

    .toc-ch {

    .toc-ch header { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; margin-bottom: 0.7rem; }

    .toc-ch time { font-size: 0.68rem; letter-spacing: 0.1em; color: var(--cyan); white-space: nowrap; }

    .toc-ch ol { list-style: none; padding: 0; display: grid; gap: 1px; }
    .toc-ch li button {
      display: flex; width: 100%; gap: 0.6rem; align-items: baseline;
      padding: 0.34rem 0.45rem;
      border-radius: 0.42rem;
      font-size: 0.8rem;
      line-height: 1.45;

      transition: background var(--duration-fast) var(--ease-entrance), color var(--duration-fast) var(--ease-entrance);
    }
    .toc-ch li button:hover { background: rgba(255,255,255,0.08); color: var(--heading); }
    .toc-ch li button.is-current { color: var(--cyan); background: rgba(124,199,255,0.1); }
    .toc-ch li button em { font-style: normal; font-size: 0.68rem; color: var(--body-dim); font-variant-numeric: tabular-nums; flex: 0 0 1.4rem; }

    /* ── 편집 모드 ─────────────────────────────────────────────────── */
    .is-editing [contenteditable] {
      outline: 1px dashed rgba(124,199,255,0.32);
      outline-offset: 3px;
      border-radius: 3px;
      transition: outline-color var(--duration-fast) var(--ease-entrance), background var(--duration-fast) var(--ease-entrance);
    }
    .is-editing [contenteditable]:hover { outline-color: rgba(124,199,255,0.6); background: rgba(124,199,255,0.06); }
    .is-editing [contenteditable]:focus {
      outline: 2px solid var(--cyan);
      background: rgba(124,199,255,0.09);
    }
    .is-editing .slide.is-active { cursor: text; }
    .is-editing .fx-layer { opacity: 0 !important; }

    .edit-bar {
      position: fixed;
      left: 50%; bottom: 4.4rem;
      transform: translate(-50%, 1rem);
      z-index: 45;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      height: 2.7rem;
      padding: 0 0.5rem 0 1.1rem;
      border-radius: 9999px;
      border: 1px solid rgba(124,199,255,0.4);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
      opacity: 0;
      visibility: hidden;
      transition: opacity 320ms var(--ease-entrance), transform 320ms var(--ease-entrance), visibility 0ms linear 320ms;

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    .edit-bar .eb-status { font-size: 0.76rem; color: var(--body-dim); white-space: nowrap; min-width: 5.4rem; }
    .edit-bar .eb-sep { width: 1px; height: 1.3rem; background: rgba(255,255,255,0.14); }
    .edit-bar .eb-input {
      width: 6.6rem; height: 1.8rem;

      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.06);
      color: var(--heading);
      font-size: 0.76rem;
      padding: 0 0.75rem;

    .edit-bar .eb-input:focus { outline: none; border-color: rgba(124,199,255,0.5); }
    .edit-bar button {
      display: inline-flex; align-items: center; gap: 0.35rem;

      font-size: 0.78rem;
      color: var(--body-muted);
      border: 1px solid var(--glass-border);

    .edit-bar button:hover { background: rgba(255,255,255,0.16); color: var(--heading); }
    .edit-bar button.primary { background: var(--action-inverse); color: var(--action-inverse-fg); border-color: transparent; }

    .edit-bar button.danger:hover { background: rgba(255,120,120,0.2); color: #ffc9c9; }

    .icon-btn.is-on { background: var(--cyan); color: #05121f; border-color: transparent; }

    .quiz-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 0.4rem; }

    .tl-wrap { margin-top: 0.9rem; }

    .tl-btn { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; padding: 0.6rem 0.95rem;

      font: inherit; font-size: 0.92rem; cursor: pointer; transition: border-color 0.15s ease; }
    .tl-btn:hover { border-color: var(--cyan); }
    .tl-count { font-size: 1.25rem; font-weight: 700; color: var(--cyan); font-variant-numeric: tabular-nums; }

    /* 사진이 없는 split 패널은 숨기고 본문을 전체 폭으로 (편집 모드에서는 업로드 슬롯 유지) */
    body:not(.is-editing) .col-fig.fig-empty { display: none; }

</head>

    <button id="editResetAll" class="danger" title="모든 슬라이드의 수정을 원래대로 되돌립니다"><span id="editResetAllLabel">전체 되돌리기</span></button>
