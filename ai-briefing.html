  <input type="file" id="photoFileInput" accept="image/*" style="display:none" />

  <script>
    /* ═══════════════════════════════════════════════════════════════
       WebGL Fluid Simulation — 표지/목차 화면 전용 (setActive 로 제어)
       ═══════════════════════════════════════════════════════════════ */
    function fluidSimulation(canvas) {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;

    let config = {
        SIM_RESOLUTION: 128,
        DYE_RESOLUTION: 360,
        DENSITY_DISSIPATION: 0.958,
        VELOCITY_DISSIPATION: 0.96,
        PRESSURE_DISSIPATION: 0.8,
        PRESSURE_ITERATIONS: 12,
        CURL: 42,
        SPLAT_RADIUS: 0.22,
        SHADING: true,
        COLORFUL: true,
        PAUSED: false,
        BACK_COLOR: { r: 4, g: 5, b: 12 },
        TRANSPARENT: false,
        BLOOM: false,
        BLOOM_ITERATIONS: 8,
        BLOOM_RESOLUTION: 256,
        BLOOM_INTENSITY: 0.8,
        BLOOM_THRESHOLD: 0.8,
        BLOOM_SOFT_KNEE: 0.7
    }

    function pointerPrototype() {
        this.id = -1;
        this.x = 0;
        this.y = 0;
        this.dx = 0;
        this.dy = 0;
        this.down = false;
        this.moved = false;
        this.color = [30, 0, 300];
    }

    let pointers = [];
    let splatStack = [];
    let bloomFramebuffers = [];
    pointers.push(new pointerPrototype());

    const { gl, ext } = getWebGLContext(canvas);

    if (isMobile())
        config.SHADING = false;
    if (!ext.supportLinearFiltering) {
        config.SHADING = false;
        config.BLOOM = false;
    }

    function getWebGLContext(canvas) {
        const params = { alpha: true, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false };

        let gl = canvas.getContext('webgl2', params);
        const isWebGL2 = !!gl;
        if (!isWebGL2)
            gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);

        let halfFloat;
        let supportLinearFiltering;
        if (isWebGL2) {
            gl.getExtension('EXT_color_buffer_float');
            supportLinearFiltering = gl.getExtension('OES_texture_float_linear');
        } else {
            halfFloat = gl.getExtension('OES_texture_half_float');
            supportLinearFiltering = gl.getExtension('OES_texture_half_float_linear');
        }

        gl.clearColor(0.0, 0.0, 0.0, 1.0);

        const halfFloatTexType = isWebGL2 ? gl.HALF_FLOAT : halfFloat.HALF_FLOAT_OES;
        let formatRGBA;
        let formatRG;
        let formatR;

        if (isWebGL2) {
            formatRGBA = getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, halfFloatTexType);
            formatRG = getSupportedFormat(gl, gl.RG16F, gl.RG, halfFloatTexType);
            formatR = getSupportedFormat(gl, gl.R16F, gl.RED, halfFloatTexType);
        }
        else {
            formatRGBA = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
            formatRG = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
            formatR = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
        }

        return {
            gl,
            ext: { formatRGBA, formatRG, formatR, halfFloatTexType, supportLinearFiltering }
        };
    }

    function getSupportedFormat(gl, internalFormat, format, type) {
        if (!supportRenderTextureFormat(gl, internalFormat, format, type)) {
            switch (internalFormat) {
                case gl.R16F:
                    return getSupportedFormat(gl, gl.RG16F, gl.RG, type);
                case gl.RG16F:
                    return getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, type);
                default:
                    return null;
            }
        }
        return { internalFormat, format }
    }

    function supportRenderTextureFormat(gl, internalFormat, format, type) {
        let texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);

        let fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);

        const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
        if (status != gl.FRAMEBUFFER_COMPLETE)
            return false;
        return true;
    }

    function isMobile() {
        return /Mobi|Android/i.test(navigator.userAgent);
    }

    class GLProgram {
        constructor(vertexShader, fragmentShader) {
            this.uniforms = {};
            this.program = gl.createProgram();

            gl.attachShader(this.program, vertexShader);
            gl.attachShader(this.program, fragmentShader);
            gl.linkProgram(this.program);

            if (!gl.getProgramParameter(this.program, gl.LINK_STATUS))
                throw gl.getProgramInfoLog(this.program);

            const uniformCount = gl.getProgramParameter(this.program, gl.ACTIVE_UNIFORMS);
            for (let i = 0; i < uniformCount; i++) {
                const uniformName = gl.getActiveUniform(this.program, i).name;
                this.uniforms[uniformName] = gl.getUniformLocation(this.program, uniformName);
            }
        }
        bind() { gl.useProgram(this.program); }
    }

    function compileShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
            throw gl.getShaderInfoLog(shader);
        return shader;
    };

    const baseVertexShader = compileShader(gl.VERTEX_SHADER, `
        precision highp float;
        attribute vec2 aPosition;
        varying vec2 vUv;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform vec2 texelSize;
        void main () {
            vUv = aPosition * 0.5 + 0.5;
            vL = vUv - vec2(texelSize.x, 0.0);
            vR = vUv + vec2(texelSize.x, 0.0);
            vT = vUv + vec2(0.0, texelSize.y);
            vB = vUv - vec2(0.0, texelSize.y);
            gl_Position = vec4(aPosition, 0.0, 1.0);
        }
    `);

    const clearShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        uniform sampler2D uTexture;
        uniform float value;
        void main () {
            gl_FragColor = value * texture2D(uTexture, vUv);
        }
    `);

    const colorShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        uniform vec4 color;
        void main () {
            gl_FragColor = color;
        }
    `);

    const backgroundShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uTexture;
        uniform float aspectRatio;
        #define SCALE 25.0
        void main () {
            vec2 uv = floor(vUv * SCALE * vec2(aspectRatio, 1.0));
            float v = mod(uv.x + uv.y, 2.0);
            v = v * 0.1 + 0.8;
            gl_FragColor = vec4(vec3(v), 1.0);
        }
    `);

    const displayShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uTexture;
        void main () {
            vec3 C = texture2D(uTexture, vUv).rgb;
            float a = max(C.r, max(C.g, C.b));
            gl_FragColor = vec4(C, a);
        }
    `);

    const displayBloomShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uTexture;
        uniform sampler2D uBloom;
        uniform sampler2D uDithering;
        uniform vec2 ditherScale;
        void main () {
            vec3 C = texture2D(uTexture, vUv).rgb;
            vec3 bloom = texture2D(uBloom, vUv).rgb;
            vec3 noise = texture2D(uDithering, vUv * ditherScale).rgb;
            noise = noise * 2.0 - 1.0;
            bloom += noise / 800.0;
            bloom = pow(bloom.rgb, vec3(1.0 / 2.2));
            C += bloom;
            float a = max(C.r, max(C.g, C.b));
            gl_FragColor = vec4(C, a);
        }
    `);

    const displayShadingShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform sampler2D uTexture;
        uniform vec2 texelSize;
        void main () {
            vec3 L = texture2D(uTexture, vL).rgb;
            vec3 R = texture2D(uTexture, vR).rgb;
            vec3 T = texture2D(uTexture, vT).rgb;
            vec3 B = texture2D(uTexture, vB).rgb;
            vec3 C = texture2D(uTexture, vUv).rgb;
            float dx = length(R) - length(L);
            float dy = length(T) - length(B);
            vec3 n = normalize(vec3(dx, dy, length(texelSize)));
            vec3 l = vec3(0.0, 0.0, 1.0);
            float diffuse = clamp(dot(n, l) + 0.7, 0.7, 1.0);
            C.rgb *= diffuse;
            float a = max(C.r, max(C.g, C.b));
            gl_FragColor = vec4(C, a);
        }
    `);

    const displayBloomShadingShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform sampler2D uTexture;
        uniform sampler2D uBloom;
        uniform sampler2D uDithering;
        uniform vec2 ditherScale;
        uniform vec2 texelSize;
        void main () {
            vec3 L = texture2D(uTexture, vL).rgb;
            vec3 R = texture2D(uTexture, vR).rgb;
            vec3 T = texture2D(uTexture, vT).rgb;
            vec3 B = texture2D(uTexture, vB).rgb;
            vec3 C = texture2D(uTexture, vUv).rgb;
            float dx = length(R) - length(L);
            float dy = length(T) - length(B);
            vec3 n = normalize(vec3(dx, dy, length(texelSize)));
            vec3 l = vec3(0.0, 0.0, 1.0);
            float diffuse = clamp(dot(n, l) + 0.7, 0.7, 1.0);
            C *= diffuse;
            vec3 bloom = texture2D(uBloom, vUv).rgb;
            vec3 noise = texture2D(uDithering, vUv * ditherScale).rgb;
            noise = noise * 2.0 - 1.0;
            bloom += noise / 800.0;
            bloom = pow(bloom.rgb, vec3(1.0 / 2.2));
            C += bloom;
            float a = max(C.r, max(C.g, C.b));
            gl_FragColor = vec4(C, a);
        }
    `);

    const bloomPrefilterShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying vec2 vUv;
        uniform sampler2D uTexture;
        uniform vec3 curve;
        uniform float threshold;
        void main () {
            vec3 c = texture2D(uTexture, vUv).rgb;
            float br = max(c.r, max(c.g, c.b));
            float rq = clamp(br - curve.x, 0.0, curve.y);
            rq = curve.z * rq * rq;
            c *= max(rq, br - threshold) / max(br, 0.0001);
            gl_FragColor = vec4(c, 0.0);
        }
    `);

    const bloomBlurShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform sampler2D uTexture;
        void main () {
            vec4 sum = vec4(0.0);
            sum += texture2D(uTexture, vL);
            sum += texture2D(uTexture, vR);
            sum += texture2D(uTexture, vT);
            sum += texture2D(uTexture, vB);
            sum *= 0.25;
            gl_FragColor = sum;
        }
    `);

    const bloomFinalShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform sampler2D uTexture;
        uniform float intensity;
        void main () {
            vec4 sum = vec4(0.0);
            sum += texture2D(uTexture, vL);
            sum += texture2D(uTexture, vR);
            sum += texture2D(uTexture, vT);
            sum += texture2D(uTexture, vB);
            sum *= 0.25;
            gl_FragColor = sum * intensity;
        }
    `);

    const splatShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uTarget;
        uniform float aspectRatio;
        uniform vec3 color;
        uniform vec2 point;
        uniform float radius;
        void main () {
            vec2 p = vUv - point.xy;
            p.x *= aspectRatio;
            vec3 splat = exp(-dot(p, p) / radius) * color;
            vec3 base = texture2D(uTarget, vUv).xyz;
            gl_FragColor = vec4(base + splat, 1.0);
        }
    `);

    const advectionManualFilteringShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uVelocity;
        uniform sampler2D uSource;
        uniform vec2 texelSize;
        uniform vec2 dyeTexelSize;
        uniform float dt;
        uniform float dissipation;
        vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
            vec2 st = uv / tsize - 0.5;
            vec2 iuv = floor(st);
            vec2 fuv = fract(st);
            vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
            vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
            vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
            vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);
            return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
        }
        void main () {
            vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
            gl_FragColor = dissipation * bilerp(uSource, coord, dyeTexelSize);
            gl_FragColor.a = 1.0;
        }
    `);

    const advectionShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uVelocity;
        uniform sampler2D uSource;
        uniform vec2 texelSize;
        uniform float dt;
        uniform float dissipation;
        void main () {
            vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
            gl_FragColor = dissipation * texture2D(uSource, coord);
            gl_FragColor.a = 1.0;
        }
    `);

    const divergenceShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D uVelocity;
        void main () {
            float L = texture2D(uVelocity, vL).x;
            float R = texture2D(uVelocity, vR).x;
            float T = texture2D(uVelocity, vT).y;
            float B = texture2D(uVelocity, vB).y;
            vec2 C = texture2D(uVelocity, vUv).xy;
            if (vL.x < 0.0) { L = -C.x; }
            if (vR.x > 1.0) { R = -C.x; }
            if (vT.y > 1.0) { T = -C.y; }
            if (vB.y < 0.0) { B = -C.y; }
            float div = 0.5 * (R - L + T - B);
            gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
        }
    `);

    const curlShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D uVelocity;
        void main () {
            float L = texture2D(uVelocity, vL).y;
            float R = texture2D(uVelocity, vR).y;
            float T = texture2D(uVelocity, vT).x;
            float B = texture2D(uVelocity, vB).x;
            float vorticity = R - L - T + B;
            gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
        }
    `);

    const vorticityShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform sampler2D uVelocity;
        uniform sampler2D uCurl;
        uniform float curl;
        uniform float dt;
        void main () {
            float L = texture2D(uCurl, vL).x;
            float R = texture2D(uCurl, vR).x;
            float T = texture2D(uCurl, vT).x;
            float B = texture2D(uCurl, vB).x;
            float C = texture2D(uCurl, vUv).x;
            vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
            force /= length(force) + 0.0001;
            force *= curl * C;
            force.y *= -1.0;
            vec2 vel = texture2D(uVelocity, vUv).xy;
            gl_FragColor = vec4(vel + force * dt, 0.0, 1.0);
        }
    `);

    const pressureShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D uPressure;
        uniform sampler2D uDivergence;
        vec2 boundary (vec2 uv) { return uv; }
        void main () {
            float L = texture2D(uPressure, boundary(vL)).x;
            float R = texture2D(uPressure, boundary(vR)).x;
            float T = texture2D(uPressure, boundary(vT)).x;
            float B = texture2D(uPressure, boundary(vB)).x;
            float C = texture2D(uPressure, vUv).x;
            float divergence = texture2D(uDivergence, vUv).x;
            float pressure = (L + R + B + T - divergence) * 0.25;
            gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
        }
    `);

    const gradientSubtractShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D uPressure;
        uniform sampler2D uVelocity;
        vec2 boundary (vec2 uv) { return uv; }
        void main () {
            float L = texture2D(uPressure, boundary(vL)).x;
            float R = texture2D(uPressure, boundary(vR)).x;
            float T = texture2D(uPressure, boundary(vT)).x;
            float B = texture2D(uPressure, boundary(vB)).x;
            vec2 velocity = texture2D(uVelocity, vUv).xy;
            velocity.xy -= vec2(R - L, T - B);
            gl_FragColor = vec4(velocity, 0.0, 1.0);
        }
    `);

    const blit = (() => {
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(0);

        return (destination) => {
            gl.bindFramebuffer(gl.FRAMEBUFFER, destination);
            gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
        }
    })();

    let simWidth, simHeight, dyeWidth, dyeHeight;
    let density, velocity, divergence, curl, pressure, bloom;

    let ditheringTexture = createNoiseTexture(256);

    const clearProgram = new GLProgram(baseVertexShader, clearShader);
    const colorProgram = new GLProgram(baseVertexShader, colorShader);
    const backgroundProgram = new GLProgram(baseVertexShader, backgroundShader);
    const displayProgram = new GLProgram(baseVertexShader, displayShader);
    const displayBloomProgram = new GLProgram(baseVertexShader, displayBloomShader);
    const displayShadingProgram = new GLProgram(baseVertexShader, displayShadingShader);
    const displayBloomShadingProgram = new GLProgram(baseVertexShader, displayBloomShadingShader);
    const bloomPrefilterProgram = new GLProgram(baseVertexShader, bloomPrefilterShader);
    const bloomBlurProgram = new GLProgram(baseVertexShader, bloomBlurShader);
    const bloomFinalProgram = new GLProgram(baseVertexShader, bloomFinalShader);
    const splatProgram = new GLProgram(baseVertexShader, splatShader);
    const advectionProgram = new GLProgram(baseVertexShader, ext.supportLinearFiltering ? advectionShader : advectionManualFilteringShader);
    const divergenceProgram = new GLProgram(baseVertexShader, divergenceShader);
    const curlProgram = new GLProgram(baseVertexShader, curlShader);
    const vorticityProgram = new GLProgram(baseVertexShader, vorticityShader);
    const pressureProgram = new GLProgram(baseVertexShader, pressureShader);
    const gradienSubtractProgram = new GLProgram(baseVertexShader, gradientSubtractShader);

    function initFramebuffers() {
        let simRes = getResolution(config.SIM_RESOLUTION);
        let dyeRes = getResolution(config.DYE_RESOLUTION);

        simWidth = simRes.width;
        simHeight = simRes.height;
        dyeWidth = dyeRes.width;
        dyeHeight = dyeRes.height;

        const texType = ext.halfFloatTexType;
        const rgba = ext.formatRGBA;
        const rg = ext.formatRG;
        const r = ext.formatR;
        const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;

        if (density == null)
            density = createDoubleFBO(dyeWidth, dyeHeight, rgba.internalFormat, rgba.format, texType, filtering);
        else
            density = resizeDoubleFBO(density, dyeWidth, dyeHeight, rgba.internalFormat, rgba.format, texType, filtering);

        if (velocity == null)
            velocity = createDoubleFBO(simWidth, simHeight, rg.internalFormat, rg.format, texType, filtering);
        else
            velocity = resizeDoubleFBO(velocity, simWidth, simHeight, rg.internalFormat, rg.format, texType, filtering);

        divergence = createFBO(simWidth, simHeight, r.internalFormat, r.format, texType, gl.NEAREST);
        curl = createFBO(simWidth, simHeight, r.internalFormat, r.format, texType, gl.NEAREST);
        pressure = createDoubleFBO(simWidth, simHeight, r.internalFormat, r.format, texType, gl.NEAREST);

        initBloomFramebuffers();
    }

    function initBloomFramebuffers() {
        let res = getResolution(config.BLOOM_RESOLUTION);
        const texType = ext.halfFloatTexType;
        const rgba = ext.formatRGBA;
        const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;

        bloom = createFBO(res.width, res.height, rgba.internalFormat, rgba.format, texType, filtering);

        bloomFramebuffers.length = 0;
        for (let i = 0; i < config.BLOOM_ITERATIONS; i++) {
            let width = res.width >> (i + 1);
            let height = res.height >> (i + 1);
            if (width < 2 || height < 2) break;
            bloomFramebuffers.push(createFBO(width, height, rgba.internalFormat, rgba.format, texType, filtering));
        }
    }

    function createFBO(w, h, internalFormat, format, type, param) {
        gl.activeTexture(gl.TEXTURE0);
        let texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);

        let fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
        gl.viewport(0, 0, w, h);
        gl.clear(gl.COLOR_BUFFER_BIT);

        return {
            texture, fbo, width: w, height: h,
            attach(id) {
                gl.activeTexture(gl.TEXTURE0 + id);
                gl.bindTexture(gl.TEXTURE_2D, texture);
                return id;
            }
        };
    }

    function createDoubleFBO(w, h, internalFormat, format, type, param) {
        let fbo1 = createFBO(w, h, internalFormat, format, type, param);
        let fbo2 = createFBO(w, h, internalFormat, format, type, param);
        return {
            get read() { return fbo1; },
            set read(value) { fbo1 = value; },
            get write() { return fbo2; },
            set write(value) { fbo2 = value; },
            swap() { let temp = fbo1; fbo1 = fbo2; fbo2 = temp; }
        }
    }

    function resizeFBO(target, w, h, internalFormat, format, type, param) {
        let newFBO = createFBO(w, h, internalFormat, format, type, param);
        clearProgram.bind();
        gl.uniform1i(clearProgram.uniforms.uTexture, target.attach(0));
        gl.uniform1f(clearProgram.uniforms.value, 1);
        blit(newFBO.fbo);
        return newFBO;
    }

    function resizeDoubleFBO(target, w, h, internalFormat, format, type, param) {
        target.read = resizeFBO(target.read, w, h, internalFormat, format, type, param);
        target.write = createFBO(w, h, internalFormat, format, type, param);
        return target;
    }

    function createNoiseTexture(size) {
        const data = new Uint8Array(size * size * 3);
        for (let i = 0; i < data.length; i++)
            data[i] = Math.floor(Math.random() * 256);
        let texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, size, size, 0, gl.RGB, gl.UNSIGNED_BYTE, data);
        return {
            texture, width: size, height: size,
            attach(id) {
                gl.activeTexture(gl.TEXTURE0 + id);
                gl.bindTexture(gl.TEXTURE_2D, texture);
                return id;
            }
        };
    }

    initFramebuffers();
    multipleSplats(34);
    for (let i = 0; i < 8; i++)
        splatStack.push(10 + parseInt(Math.random() * 10));

    let lastColorChangeTime = Date.now();
    let virtualSeeded = false;
    let orbitAngle = 0;
    let vPrevX = 0, vPrevY = 0;
    let virtualColor = null;
    let lastVColorTime = 0;
    const engineStart = Date.now();
    const ORBIT_RADIUS = 300;
    const ORBIT_SPEED = 0.026;
    const ORBIT_START_DELAY = 700;

    let rafHandle = 0;
    let destroyed = false;
    let active = true;   // 표지/목차에서만 true
    let lastFrameTs = 0;

    update();

    function update(nowTs) {
        if (destroyed) return;
        rafHandle = requestAnimationFrame(update);
        if (!active) return;          // 강의 슬라이드에서는 시뮬레이션 정지
        if (document.hidden) return;  // 탭이 백그라운드면 정지
        nowTs = nowTs || performance.now();
        if (nowTs - lastFrameTs < 30) return;   // ~33fps 상한 (저사양 PC 보호)
        lastFrameTs = nowTs;
        resizeCanvas();
        driveVirtualPointer();
        input();
        if (!config.PAUSED)
            step(0.016);
        render(null);
    }

    function driveVirtualPointer() {
        if (Date.now() - engineStart < ORBIT_START_DELAY)
            return;
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const base = Math.min(ORBIT_RADIUS, canvas.width * 0.35, canvas.height * 0.35);
        const r = base * (0.72 + 0.28 * Math.sin(orbitAngle * 0.37));
        orbitAngle += ORBIT_SPEED;
        const x = cx + Math.cos(orbitAngle) * r;
        const y = cy + Math.sin(orbitAngle) * r;
        if (!virtualSeeded) {
            virtualSeeded = true;
            vPrevX = x;
            vPrevY = y;
            return;
        }
        if (!virtualColor || Date.now() - lastVColorTime > 120) {
            virtualColor = generateColor();
            virtualColor.r *= 3.2;
            virtualColor.g *= 3.2;
            virtualColor.b *= 3.2;
            lastVColorTime = Date.now();
        }
        const dx = (x - vPrevX) * 9.0;
        const dy = (y - vPrevY) * 9.0;
        vPrevX = x;
        vPrevY = y;
        splat(x, y, dx, dy, virtualColor);
    }

    function input() {
        if (splatStack.length > 0)
            multipleSplats(splatStack.pop());

        for (let i = 0; i < pointers.length; i++) {
            const p = pointers[i];
            if (p.moved) {
                splat(p.x, p.y, p.dx, p.dy, p.color);
                p.moved = false;
            }
        }

        if (!config.COLORFUL) return;

        if (lastColorChangeTime + 100 < Date.now()) {
            lastColorChangeTime = Date.now();
            for (let i = 0; i < pointers.length; i++)
                pointers[i].color = generateColor();
        }
    }

    function step(dt) {
        gl.disable(gl.BLEND);
        gl.viewport(0, 0, simWidth, simHeight);

        curlProgram.bind();
        gl.uniform2f(curlProgram.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
        gl.uniform1i(curlProgram.uniforms.uVelocity, velocity.read.attach(0));
        blit(curl.fbo);

        vorticityProgram.bind();
        gl.uniform2f(vorticityProgram.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
        gl.uniform1i(vorticityProgram.uniforms.uVelocity, velocity.read.attach(0));
        gl.uniform1i(vorticityProgram.uniforms.uCurl, curl.attach(1));
        gl.uniform1f(vorticityProgram.uniforms.curl, config.CURL);
        gl.uniform1f(vorticityProgram.uniforms.dt, dt);
        blit(velocity.write.fbo);
        velocity.swap();

        divergenceProgram.bind();
        gl.uniform2f(divergenceProgram.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
        gl.uniform1i(divergenceProgram.uniforms.uVelocity, velocity.read.attach(0));
        blit(divergence.fbo);

        clearProgram.bind();
        gl.uniform1i(clearProgram.uniforms.uTexture, pressure.read.attach(0));
        gl.uniform1f(clearProgram.uniforms.value, config.PRESSURE_DISSIPATION);
        blit(pressure.write.fbo);
        pressure.swap();

        pressureProgram.bind();
        gl.uniform2f(pressureProgram.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
        gl.uniform1i(pressureProgram.uniforms.uDivergence, divergence.attach(0));
        for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
            gl.uniform1i(pressureProgram.uniforms.uPressure, pressure.read.attach(1));
            blit(pressure.write.fbo);
            pressure.swap();
        }

        gradienSubtractProgram.bind();
        gl.uniform2f(gradienSubtractProgram.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
        gl.uniform1i(gradienSubtractProgram.uniforms.uPressure, pressure.read.attach(0));
        gl.uniform1i(gradienSubtractProgram.uniforms.uVelocity, velocity.read.attach(1));
        blit(velocity.write.fbo);
        velocity.swap();

        advectionProgram.bind();
        gl.uniform2f(advectionProgram.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
        if (!ext.supportLinearFiltering)
            gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, 1.0 / simWidth, 1.0 / simHeight);
        let velocityId = velocity.read.attach(0);
        gl.uniform1i(advectionProgram.uniforms.uVelocity, velocityId);
        gl.uniform1i(advectionProgram.uniforms.uSource, velocityId);
        gl.uniform1f(advectionProgram.uniforms.dt, dt);
        gl.uniform1f(advectionProgram.uniforms.dissipation, config.VELOCITY_DISSIPATION);
        blit(velocity.write.fbo);
        velocity.swap();

        gl.viewport(0, 0, dyeWidth, dyeHeight);

        if (!ext.supportLinearFiltering)
            gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, 1.0 / dyeWidth, 1.0 / dyeHeight);
        gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
        gl.uniform1i(advectionProgram.uniforms.uSource, density.read.attach(1));
        gl.uniform1f(advectionProgram.uniforms.dissipation, config.DENSITY_DISSIPATION);
        blit(density.write.fbo);
        density.swap();
    }

    function render(target) {
        if (config.BLOOM)
            applyBloom(density.read, bloom);

        if (target == null || !config.TRANSPARENT) {
            gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
            gl.enable(gl.BLEND);
        } else {
            gl.disable(gl.BLEND);
        }

        let width = target == null ? gl.drawingBufferWidth : dyeWidth;
        let height = target == null ? gl.drawingBufferHeight : dyeHeight;

        gl.viewport(0, 0, width, height);

        if (!config.TRANSPARENT) {
            colorProgram.bind();
            let bc = config.BACK_COLOR;
            gl.uniform4f(colorProgram.uniforms.color, bc.r / 255, bc.g / 255, bc.b / 255, 1);
            blit(target);
        }

        if (target == null && config.TRANSPARENT) {
            backgroundProgram.bind();
            gl.uniform1f(backgroundProgram.uniforms.aspectRatio, canvas.width / canvas.height);
            blit(null);
        }

        if (config.SHADING) {
            let program = config.BLOOM ? displayBloomShadingProgram : displayShadingProgram;
            program.bind();
            gl.uniform2f(program.uniforms.texelSize, 1.0 / width, 1.0 / height);
            gl.uniform1i(program.uniforms.uTexture, density.read.attach(0));
            if (config.BLOOM) {
                gl.uniform1i(program.uniforms.uBloom, bloom.attach(1));
                gl.uniform1i(program.uniforms.uDithering, ditheringTexture.attach(2));
                let scale = getTextureScale(ditheringTexture, width, height);
                gl.uniform2f(program.uniforms.ditherScale, scale.x, scale.y);
            }
        } else {
            let program = config.BLOOM ? displayBloomProgram : displayProgram;
            program.bind();
            gl.uniform1i(program.uniforms.uTexture, density.read.attach(0));
            if (config.BLOOM) {
                gl.uniform1i(program.uniforms.uBloom, bloom.attach(1));
                gl.uniform1i(program.uniforms.uDithering, ditheringTexture.attach(2));
                let scale = getTextureScale(ditheringTexture, width, height);
                gl.uniform2f(program.uniforms.ditherScale, scale.x, scale.y);
            }
        }

        blit(target);
    }

    function applyBloom(source, destination) {
        if (bloomFramebuffers.length < 2) return;

        let last = destination;

        gl.disable(gl.BLEND);
        bloomPrefilterProgram.bind();
        let knee = config.BLOOM_THRESHOLD * config.BLOOM_SOFT_KNEE + 0.0001;
        gl.uniform3f(bloomPrefilterProgram.uniforms.curve, config.BLOOM_THRESHOLD - knee, knee * 2, 0.25 / knee);
        gl.uniform1f(bloomPrefilterProgram.uniforms.threshold, config.BLOOM_THRESHOLD);
        gl.uniform1i(bloomPrefilterProgram.uniforms.uTexture, source.attach(0));
        gl.viewport(0, 0, last.width, last.height);
        blit(last.fbo);

        bloomBlurProgram.bind();
        for (let i = 0; i < bloomFramebuffers.length; i++) {
            let dest = bloomFramebuffers[i];
            gl.uniform2f(bloomBlurProgram.uniforms.texelSize, 1.0 / last.width, 1.0 / last.height);
            gl.uniform1i(bloomBlurProgram.uniforms.uTexture, last.attach(0));
            gl.viewport(0, 0, dest.width, dest.height);
            blit(dest.fbo);
            last = dest;
        }

        gl.blendFunc(gl.ONE, gl.ONE);
        gl.enable(gl.BLEND);

        for (let i = bloomFramebuffers.length - 2; i >= 0; i--) {
            let baseTex = bloomFramebuffers[i];
            gl.uniform2f(bloomBlurProgram.uniforms.texelSize, 1.0 / last.width, 1.0 / last.height);
            gl.uniform1i(bloomBlurProgram.uniforms.uTexture, last.attach(0));
            gl.viewport(0, 0, baseTex.width, baseTex.height);
            blit(baseTex.fbo);
            last = baseTex;
        }

        gl.disable(gl.BLEND);
        bloomFinalProgram.bind();
        gl.uniform2f(bloomFinalProgram.uniforms.texelSize, 1.0 / last.width, 1.0 / last.height);
        gl.uniform1i(bloomFinalProgram.uniforms.uTexture, last.attach(0));
        gl.uniform1f(bloomFinalProgram.uniforms.intensity, config.BLOOM_INTENSITY);
        gl.viewport(0, 0, destination.width, destination.height);
        blit(destination.fbo);
    }

    function splat(x, y, dx, dy, color) {
        gl.viewport(0, 0, simWidth, simHeight);
        splatProgram.bind();
        gl.uniform1i(splatProgram.uniforms.uTarget, velocity.read.attach(0));
        gl.uniform1f(splatProgram.uniforms.aspectRatio, canvas.width / canvas.height);
        gl.uniform2f(splatProgram.uniforms.point, x / canvas.width, 1.0 - y / canvas.height);
        gl.uniform3f(splatProgram.uniforms.color, dx, -dy, 1.0);
        gl.uniform1f(splatProgram.uniforms.radius, config.SPLAT_RADIUS / 100.0);
        blit(velocity.write.fbo);
        velocity.swap();

        gl.viewport(0, 0, dyeWidth, dyeHeight);
        gl.uniform1i(splatProgram.uniforms.uTarget, density.read.attach(0));
        gl.uniform3f(splatProgram.uniforms.color, color.r, color.g, color.b);
        blit(density.write.fbo);
        density.swap();
    }

    function multipleSplats(amount) {
        for (let i = 0; i < amount; i++) {
            const color = generateColor();
            color.r *= 10.0;
            color.g *= 10.0;
            color.b *= 10.0;
            splat(canvas.width * Math.random(), canvas.height * Math.random(),
                  1000 * (Math.random() - 0.5), 1000 * (Math.random() - 0.5), color);
        }
    }

    function resizeCanvas() {
        if (canvas.width != canvas.clientWidth || canvas.height != canvas.clientHeight) {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            initFramebuffers();
        }
    }

    function pointerPos(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    const teardown = [];
    function on(target, type, handler, opts) {
        target.addEventListener(type, handler, opts);
        teardown.push(() => target.removeEventListener(type, handler, opts));
    }

    on(window, 'mousemove', e => {
        if (!active) return;
        const { x, y } = pointerPos(e.clientX, e.clientY);
        const p = pointers[0];
        if (!p.everMoved) {
            p.everMoved = true;
            p.x = x;
            p.y = y;
            p.down = true;
            return;
        }
        p.down = true;
        p.moved = true;
        p.dx = (x - p.x) * 5.0;
        p.dy = (y - p.y) * 5.0;
        p.x = x;
        p.y = y;
        p.color = generateColor();
    });

    on(window, 'touchmove', e => {
        if (!active) return;
        const touches = e.targetTouches;
        for (let i = 0; i < touches.length; i++) {
            if (i >= pointers.length) pointers.push(new pointerPrototype());
            const p = pointers[i];
            const { x, y } = pointerPos(touches[i].clientX, touches[i].clientY);
            p.down = true;
            p.moved = p.everMoved === true;
            p.everMoved = true;
            p.dx = (x - p.x) * 8.0;
            p.dy = (y - p.y) * 8.0;
            p.x = x;
            p.y = y;
        }
    }, { passive: true });

    on(window, 'touchstart', e => {
        if (!active) return;
        const touches = e.targetTouches;
        for (let i = 0; i < touches.length; i++) {
            if (i >= pointers.length) pointers.push(new pointerPrototype());
            const p = pointers[i];
            const { x, y } = pointerPos(touches[i].clientX, touches[i].clientY);
            p.id = touches[i].identifier;
            p.down = true;
            p.x = x;
            p.y = y;
            p.color = generateColor();
        }
    }, { passive: true });

    on(window, 'mouseup', () => { pointers[0].down = false; });

    on(window, 'touchend', e => {
        const touches = e.changedTouches;
        for (let i = 0; i < touches.length; i++)
            for (let j = 0; j < pointers.length; j++)
                if (touches[i].identifier == pointers[j].id)
                    pointers[j].down = false;
    });

    function generateColor() {
        const h = 0.5 + Math.random() * 0.42;
        let c = HSVtoRGB(h, 0.95, 1.0);
        c.r *= 0.92; c.g *= 0.92; c.b *= 0.92;
        return c;
    }

    function HSVtoRGB(h, s, v) {
        let r, g, b, i, f, p, q, t;
        i = Math.floor(h * 6);
        f = h * 6 - i;
        p = v * (1 - s);
        q = v * (1 - f * s);
        t = v * (1 - (1 - f) * s);
        switch (i % 6) {
            case 0: r = v, g = t, b = p; break;
            case 1: r = q, g = v, b = p; break;
            case 2: r = p, g = v, b = t; break;
            case 3: r = p, g = q, b = v; break;
            case 4: r = t, g = p, b = v; break;
            case 5: r = v, g = p, b = q; break;
        }
        return { r, g, b };
    }

    function getResolution(resolution) {
        let aspectRatio = gl.drawingBufferWidth / gl.drawingBufferHeight;
        if (aspectRatio < 1) aspectRatio = 1.0 / aspectRatio;
        let max = Math.round(resolution * aspectRatio);
        let min = Math.round(resolution);
        return gl.drawingBufferWidth > gl.drawingBufferHeight
            ? { width: max, height: min }
            : { width: min, height: max };
    }

    function getTextureScale(texture, width, height) {
        return { x: width / texture.width, y: height / texture.height };
    }

    return {
        setActive(v) { active = !!v; },
        destroy() {
            destroyed = true;
            if (rafHandle) cancelAnimationFrame(rafHandle);
            for (const off of teardown) off();
        }
    };
}

    { t: "Part 3 — 三井チーム活動",           time: "32–50分" },

  /* 블록 헬퍼 --------------------------------------------------- */
  const card = (title, items, cls = "", tag = "") => `
    <div class="card ${cls}">
      <h4>${title}${tag ? `<b>${tag}</b>` : ""}</h4>
      ${Array.isArray(items)
        ? `<ul>${items.map(i => `<li>${i}</li>`).join("")}</ul>`
        : `<p>${items}</p>`}
    </div>`;

  const flow = (items) => `<div class="flow">${items.map(i => `<span>${i}</span>`).join("")}</div>`;
  const chips = (items) => `<div class="chips">${items.map(i => `<span class="chip">${i}</span>`).join("")}</div>`;
  const quote = (text, sub = "") => `<blockquote class="quote">${text}${sub ? `<small>${sub}</small>` : ""}</blockquote>`;
  const steps = (items, cls = "") => `<ol class="steps ${cls}">${items.map(i => `<li>${i}</li>`).join("")}</ol>`;

  const table = (head, rows, numCols = []) => `
    <div class="card" style="padding:1.1rem 1.2rem 0.6rem">
      <table>
        <thead><tr>${head.map((h, i) => `<th class="${numCols.includes(i) ? "t-num" : ""}">${h}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${numCols.includes(i) ? "t-num" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody>
      </table>
    </div>`;

  const bars = (rows) => `
    <div class="card"><div class="bars">${rows.map(([l, v]) => `
      <div class="bar">
        <span>${l}</span>
        <div class="bar-t"><i style="width:${(v / 5 * 100).toFixed(0)}%"></i></div>
        <span class="bar-v">${v.toFixed(1)}</span>
      </div>`).join("")}</div></div>`;

  const dots = (n) => `<span class="dots">${[1,2,3,4,5].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`;
  const toolTile = (name, mark, desc, color = "#99dcff") => `
    <div class="tool-tile" style="--tool:${color}">
      <span class="tool-logo">${mark}</span>
      <div class="tool-meta"><b>${name}</b><small>${desc}</small></div>
    </div>`;
  const toolSection = (title, items) => `
    <div class="tool-section">
      <h4>${title}</h4>
      <div class="tool-tiles">${items.join("")}</div>
    </div>`;

      confirmReset: (n) => `${n}번 슬라이드의 수정 내용을 원래대로 되돌립니다.`,
      confirmResetAll: "모든 슬라이드의 수정 내용을 되돌립니다. 계속할까요?",
      imgFail: "이미지를 불러오지 못했습니다.",
      stampBy: "익명", stampPrefix: "✎ ", stampSep: " · 수정: "
    },
    ja: {
      langLabel: "한국어",
      fsTitle: "フルスクリーン (F)",
      editTitle: "編集モード (E)", editLabel: "編集",
      tocTitle: "目次 (M / Esc)", tocLabel: "目次",
      tocHeading: "目次",
      tocSubPrefix: "60分・5パート+付録・全", tocSubSuffix: "枚 — クリックすると該当スライドに移動します。",
      tocCloseLabel: "閉じる",
      prevTitle: "前へ (←)", prevLabel: "前へ",
      nextTitle: "次へ (→ / Space)", nextLabel: "次へ",
      hintHtml: `<kbd>←</kbd><kbd>→</kbd> ページ · <kbd>M</kbd> 目次 · <kbd>F</kbd> フルスクリーン`,
      editorPlaceholder: "編集者名",
      editBarLabel: "編集モード",
      savedMsg: "自動保存されました", savedFallback: "このウィンドウのみ保持 — エクスポートが必要",
      exportBtn: "HTMLをエクスポート", exportTitle: "変更内容を反映した新しいHTMLファイルをダウンロードします",
      resetBtn: "このスライドを元に戻す", resetTitle: "このスライドの変更を元に戻します",
      resetAllBtn: "すべて元に戻す", resetAllTitle: "すべてのスライドの変更を元に戻します",
      doneBtn: "編集終了",
      uploadBtn: "写真をアップロード", removeBtn: "写真を削除",
      placeholder: "クリックして写真をアップロード",
      savingMsg: "保存中…", resetDoneMsg: "元に戻しました", exportedMsg: "エクスポートしました",
      confirmReset: (n) => `${n}枚目のスライドの変更を元に戻します。`,
      confirmResetAll: "すべてのスライドの変更を元に戻します。続けますか?",
      imgFail: "画像を読み込めませんでした。",
      stampBy: "匿名", stampPrefix: "✎ ", stampSep: " · 編集: "
    }
  };
  const T = () => CHROME[LANG];

  /* ── 실사진 패널 — 사용자가 업로드한 이미지를 img 슬롯(slug)별로 보관 ── */
  const IMAGE_KEY = "mitsui-deck-images-v1";
  const UPLOAD_ICON = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"></path><path d="M7 10l5-5 5 5"></path><path d="M12 5v12"></path></svg>';

  function readStoredImages() {
    const baked = (window.__DECK_IMAGES__ && typeof window.__DECK_IMAGES__ === "object") ? window.__DECK_IMAGES__ : {};
    try {
      const raw = localStorage.getItem(IMAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      if (parsed && typeof parsed === "object") return Object.assign({}, baked, parsed);
    } catch (e) { /* 저장소 접근 불가 — 구워진 이미지만 사용 */ }
    return Object.assign({}, baked);
  }
  let images = readStoredImages();
  let imagesStorageOK = true;

  /* ── 수정자 이름 — 편집 스탬프에 붙는다 ─────────────────────────── */
  const EDITOR_KEY = "mitsui-deck-editor-name";
  let editorName = "";
  try { editorName = localStorage.getItem(EDITOR_KEY) || ""; } catch (e) { /* noop */ }
  function persistImages() {
    try { localStorage.setItem(IMAGE_KEY, JSON.stringify(images)); imagesStorageOK = true; }
    catch (e) { imagesStorageOK = false; }
  }
  /* 모든 슬라이드가 같은 화면 자리(inset:0)에 겹쳐 있어 네이티브
     loading="lazy" 는 효과가 없다 — 브라우저가 "화면 안"으로 보고
     전부 즉시 디코드해버려서, 사진을 여러 장 올릴수록 느려진다.
     그래서 현재 슬라이드 근처에만 실제 src 를 심고, 나머지는 비워서
     디코드/메모리 비용을 피한다. */
  const PHOTO_HYDRATE_RANGE = 1;
  function applyImages() {
    document.querySelectorAll(".photo-host").forEach(host => {
      const slug = host.dataset.imgSlug;
      const url = images[slug] || "";
      host.classList.toggle("has-photo", !!url);
      const fig = host.closest(".col-fig");
      if (fig) {
        fig.classList.toggle("fig-empty", !url);
        host.closest(".slide-inner")?.classList.toggle("no-fig", !url);
      }
      const img = host.querySelector(".photo-img");
      if (!img) return;
      const slideEl = host.closest(".slide");
      const i = slideEl ? Number(slideEl.dataset.i) : -1;
      const near = url && Number.isFinite(i) && Math.abs(i - index) <= PHOTO_HYDRATE_RANGE;
      if (near) { if (img.src !== url) img.src = url; }
      else if (img.getAttribute("src")) { img.removeAttribute("src"); }
    });
  }

  function photoHost(s, mode = "panel") {
    if (!s || !s.img) return "";
    const slug = s.img;
    const url = images[slug] || "";
    const img = `<img class="photo-img" alt="" decoding="async" />`;
    return `<div class="photo-host photo-${mode} ${url ? "has-photo" : ""}" data-img-slug="${slug}">
      ${mode === "bg" ? `<div class="photo-frame">${img}</div>` : img}
      <div class="photo-placeholder">${T().placeholder}</div>
      <button type="button" class="photo-upload-btn" data-upload-slug="${slug}">${UPLOAD_ICON}${T().uploadBtn}</button>
      <button type="button" class="photo-remove-btn" data-remove-slug="${slug}">${T().removeBtn}</button>
    </div>`;
  }

  function renderCoverInner(s) {
    return `
      <div class="lockup lockup-lg">
        <span class="lg-item">
          <img class="lg-img" src="img/logo-mitsui.png" alt="MITSUI KOREA" />
          <span class="lg-text">MITSUI KOREA</span>
        </span>
        <span class="lg-x">×</span>
        <span class="lg-item">
          <img class="lg-img" src="img/logo-rikkei.png" alt="RIKKEISOFT KOREA" />
          <span class="lg-text">RIKKEISOFT KOREA</span>
        </span>
      </div>
      <p class="badge">${s.badge}</p>
      <h1 data-word-reveal>${s.title}</h1>
      <p class="subline" data-word-reveal>${s.subline}</p>
      <div class="cta-row">
        <button class="pill-button" data-go="1">${s.ctaPrimary}
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button class="pill-button ghost" data-toc>${s.ctaSecondary}</button>
      </div>`;
  }

  function renderDividerInner(s) {
    return `
      <div class="divider-inner">
        <div class="divider-num">${pad(s.ch)}</div>
        <div class="divider-kicker">${s.partLabel}</div>
        <h2 class="divider-title">${s.title}</h2>
        <p class="divider-teaser">${s.teaser}</p>
        <ul class="divider-bullets">${s.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
        <div class="divider-time">${s.time}</div>
      </div>`;
  }

  /* resetSlide / editResetAll — 슬라이드 종류에 맞는 렌더러를 고른다 */
  function renderSlideInner(s) {
    if (s.cover) return renderCoverInner(s);
    if (s.divider) return renderDividerInner(s);
    return renderInner(s);
  }

  function renderInner(s) {
    const head = `
      ${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ""}
      <h2 class="s-title">${s.title}</h2>
      ${s.lead ? `<p class="lead">${s.lead}</p>` : ""}`;

    if (s.layout === "split") {
      return `
          <div class="col-main">${head}${s.body || ""}</div>
          <figure class="col-fig">
            ${s.figureHtml || photoHost(s, "panel")}
            ${s.cap ? `<figcaption>${s.cap}</figcaption>` : ""}
          </figure>`;
    }
    return `${head}${s.body || ""}`;
  }

  /* 슬라이드 마크업 — 언어 전환 시 다시 호출된다 */
  let slideEls = [];
  function buildDeck() {
    deck.innerHTML = SLIDES.map((s, i) => {
      if (s.cover) {
        return `
      <section class="slide cover" data-i="${i}">
        <div class="slide-inner">${renderCoverInner(s)}</div>
        <div class="cover-meta">
          <span>${s.metaPrefix}${TOTAL}${s.metaSuffix}</span>
          <span>${s.metaHint}</span>
        </div>
      </section>`;
      }

      if (s.divider) {
        return `
      <section class="slide divider-slide" data-i="${i}">
        <div class="slide-inner">${renderDividerInner(s)}</div>
      </section>`;
      }

      if (s.layout === "split") {
        return `
      <section class="slide" data-i="${i}">
        <div class="slide-inner is-split ${s.cls || ""}">${renderInner(s)}</div>
      </section>`;
      }

      return `
      <section class="slide" data-i="${i}">
        ${s.img ? `${photoHost(s, "bg")}<div class="slide-veil"></div>` : ""}
        <div class="slide-inner ${s.cls || ""}">${renderInner(s)}</div>
      </section>`;
    }).join("");
    slideEls = [...deck.querySelectorAll(".slide")];
  }

  function ensureInstructorPhotos() {
    const instructorSlide = slideEls[1];
    if (!instructorSlide) return;
    const bio = instructorSlide.querySelector(".bio");
    if (!bio || bio.children.length < 2) return;
    const left = bio.children[0];
    const right = bio.children[1];
    left.classList.add("bio-profile");
    right.classList.add("bio-content");

    // 이전 저장본에 이름/직함이 왼쪽에 남아 있어도 오른쪽으로 이동한다.
    const name = left.querySelector(".bio-name");
    const role = left.querySelector(".bio-role");
    if (role) right.insertBefore(role, right.firstChild);
    if (name) right.insertBefore(name, right.firstChild);

    // 왼쪽은 흑백 프로필 한 장만 크게 유지한다.
    left.innerHTML = instructorPhotosMarkup(LANG);
  }

  totalNo.textContent = pad(TOTAL);
  document.getElementById("tocTotal").textContent = TOTAL;

  /* 목차 — 언어 전환 시 다시 호출된다 */
  function buildToc() {
    tocGrid.innerHTML = CHAPTERS.map((c, ci) => {
      const items = SLIDES.map((s, i) => ({ s, i })).filter(x => x.s.ch === ci);
      if (!items.length) return "";
      return `
      <div class="toc-ch" data-ch="${ci}">
        <header>
          <h3>${c.t}</h3>
          ${c.time ? `<time>${c.time}</time>` : ""}
        </header>
        <ol>
          ${items.map(x => `<li><button data-go="${x.i}"><em>${pad(x.i + 1)}</em><span>${x.s.nav || x.s.title}</span></button></li>`).join("")}
        </ol>
      </div>`;
    }).join("");
  }

  buildDeck();
  buildToc();

  /* ═══════════════════════════════════════════════════════════════
     편집 모드 — 슬라이드 텍스트를 브라우저에서 직접 고친다.
     · 수정 내용은 브라우저(localStorage)에 자동 저장된다.
     · "HTML 내보내기"로 수정이 반영된 새 HTML 파일을 받을 수 있다.
     · 언어별로 독립적으로 저장되며, 저장/업로드 시각과 수정자 이름이
       빨간색 스탬프로 표시된다.
     ═══════════════════════════════════════════════════════════════ */
  const EDIT_KEY = "mitsui-deck-edits-v3";

  const EDITABLE = [
    ".s-title", ".lead", ".kicker", ".quote", ".note",
    ".card h4", ".card li", ".card p",
    "th", "td",
    ".chip", ".flow span", ".steps li",
    ".day time", ".day li > div > b", ".day span",
    ".bar span",
    ".era .yr", ".era .tg", ".era p", ".era-label",
    ".bio-name", ".bio-role",
    ".ladder-row .lv", ".ladder-row .ds", ".ladder-row .pt",
    ".tree-row code", ".tree-row em",
    ".col-fig figcaption",
    ".badge", ".cover h1", ".cover .subline", ".cover-meta span",
    ".lg-text",
    ".divider-title", ".divider-teaser", ".divider-bullets li", ".divider-time"
  ].join(",");

  let editMode = false;
  let storageOK = true;

  function readStoredEdits() {
    try {
      const raw = localStorage.getItem(EDIT_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      if (parsed && parsed.ko && parsed.ja) return parsed;
    } catch (e) {
      // file:// 환경이나 시크릿 모드 등에서 저장소가 막힐 수 있다.
      // 이때 편집은 이번 세션에만 유지되고, 보관은 "HTML 내보내기"로 한다.
      storageOK = false;
    }
    return { ko: { slides: {}, meta: {} }, ja: { slides: {}, meta: {} } };
  }

  let edits = readStoredEdits();
  const curEdits = () => edits[LANG];

  function persistEdits() {
    if (!storageOK) return;
    try { localStorage.setItem(EDIT_KEY, JSON.stringify(edits)); }
    catch (e) { storageOK = false; }
  }

  const SAVED_MSG = () => storageOK ? T().savedMsg : T().savedFallback;

  function fmtStamp(ts) {
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function renderStamp(i) {
    const el = slideEls[i];
    if (!el) return;
    let stamp = el.querySelector(".edit-stamp");
    const m = curEdits().meta[i];
    if (!m) { if (stamp) stamp.remove(); return; }
    const text = `${T().stampPrefix}${fmtStamp(m.at)}${T().stampSep}${m.by}`;
    if (!stamp) { stamp = document.createElement("div"); stamp.className = "edit-stamp"; el.appendChild(stamp); }
    stamp.textContent = text;
  }
  function renderAllStamps() { Object.keys(curEdits().meta).forEach(renderStamp); }
  function stampEdit(i) {
    if (i == null) return;
    curEdits().meta[i] = { at: Date.now(), by: (editorName || "").trim() || T().stampBy };
    persistEdits();
    renderStamp(i);
  }

  /* 파일에 구워진 편집(내보내기 결과) → 브라우저 저장분 순으로 적용 */
  function applyEdits() {
    const baked = (window.__DECK_EDITS__ && window.__DECK_EDITS__[LANG] && window.__DECK_EDITS__[LANG].slides) || {};
    const merged = Object.assign({}, baked, curEdits().slides || {});
    Object.keys(merged).forEach(i => {
      const inner = slideEls[i] && slideEls[i].querySelector(".slide-inner");
      if (inner && typeof merged[i] === "string") inner.innerHTML = merged[i];
    });
    ensureInstructorPhotos();
    applyImages();
    renderAllStamps();
  }

  function editableNodes() {
    const list = [...document.querySelectorAll(EDITABLE)];
    return list.filter(el => !el.closest("#toc") && !el.closest(".edit-bar"));
  }

  function setEditStatus(text) {
    const el = document.getElementById("editStatus");
    if (el) el.textContent = text;
  }

  let saveTimer = 0;
  function scheduleSave(slideEl) {
    const i = slideEl && slideEl.dataset.i;
    if (i == null) return;
    setEditStatus(T().savingMsg);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const inner = slideEl.querySelector(".slide-inner");
      if (!inner) return;
      curEdits().slides[i] = inner.innerHTML;
      stampEdit(i);
      setEditStatus(SAVED_MSG());
    }, 400);
  }

  function setEditMode(on) {
    editMode = on;
    document.body.classList.toggle("is-editing", on);
    document.getElementById("editBtn").classList.toggle("is-on", on);

    editableNodes().forEach(el => {
      if (on) el.setAttribute("contenteditable", "true");
      else el.removeAttribute("contenteditable");
    });

    if (on) {
      setToc(false);
      // 편집 중에는 자동 축소를 풀어 커서 위치와 글자 크기를 정확히 맞춘다
      slideEls.forEach(s => {
        const inner = s.querySelector(".slide-inner");
        if (inner) inner.style.zoom = "";
      });
      setEditStatus(SAVED_MSG());
    } else {
      fitAll();
    }
    syncFx();
  }

  /* 붙여넣기는 서식 없이 — 외부 서식이 슬라이드를 깨뜨리지 않게 */
  document.addEventListener("paste", (e) => {
    if (!e.target.isContentEditable) return;
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, text);
  });

  document.addEventListener("input", (e) => {
    if (!editMode || !e.target.isContentEditable) return;
    scheduleSave(e.target.closest(".slide"));
  });

  /* 편집 중 Enter 가 블록을 쪼개지 않도록 줄바꿈으로 처리 */
  document.addEventListener("keydown", (e) => {
    if (!editMode || !e.target.isContentEditable) return;
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      document.execCommand("insertLineBreak");
    }
  });

  /* 사진 업로드 — 편집 모드에서 패널을 클릭하면 로컬 이미지를 올릴 수 있다 */
  const photoFileInput = document.getElementById("photoFileInput");
  let pendingUploadSlug = null;
  let pendingUploadSlideIndex = null;

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const MAX = 2400;
          let { width, height } = img;
          if (width <= MAX && height <= MAX) { resolve(reader.result); return; }
          const scale = MAX / Math.max(width, height);
          width = Math.round(width * scale); height = Math.round(height * scale);
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", 0.94));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* ── Interactive widgets: quiz reveal · tally vote · workshop timer ── */
  let wsRemain = 600, wsTick = null;
  function wsRender() {
    const m = String(Math.floor(wsRemain / 60)).padStart(2, "0");
    const s = String(wsRemain % 60).padStart(2, "0");
    document.querySelectorAll(".ws-digits").forEach((d) => { d.textContent = m + ":" + s; });
    document.querySelectorAll(".ws-timer").forEach((w) => w.classList.toggle("done", wsRemain === 0));
  }
  function wsStop() { if (wsTick) { clearInterval(wsTick); wsTick = null; } }
  document.addEventListener("click", (e) => {
    const rv = e.target.closest(".rv-btn");
    if (rv && !rv.dataset.ws) { rv.closest(".quiz-item")?.classList.add("is-open"); return; }
    const tl = e.target.closest(".tl-btn");
    if (tl) {
      const c = tl.querySelector(".tl-count");
      if (c) c.textContent = String((parseInt(c.textContent, 10) || 0) + 1);
      return;
    }
    const tw = e.target.closest("[data-ws]");
    if (!tw) return;
    const act = tw.dataset.ws;
    if (act === "start" && !wsTick) {
      wsTick = setInterval(() => {
        if (wsRemain > 0) { wsRemain -= 1; wsRender(); }
        if (wsRemain === 0) wsStop();
      }, 1000);
    } else if (act === "pause") { wsStop(); }
    else if (act === "reset") { wsStop(); wsRemain = 600; wsRender(); }
  });

  document.addEventListener("click", (e) => {
    const upBtn = e.target.closest(".photo-upload-btn");
    if (upBtn) {
      pendingUploadSlug = upBtn.dataset.uploadSlug;
      pendingUploadSlideIndex = upBtn.closest(".slide")?.dataset.i ?? null;
      photoFileInput.value = "";
      photoFileInput.click();
      return;
    }
    const rmBtn = e.target.closest(".photo-remove-btn");
    if (rmBtn) {
      const slug = rmBtn.dataset.removeSlug;
      delete images[slug];
      persistImages();
      applyImages();
      const i = rmBtn.closest(".slide")?.dataset.i;
      if (i != null) stampEdit(i);
      return;
    }
  });

  photoFileInput.addEventListener("change", async () => {
    const file = photoFileInput.files && photoFileInput.files[0];
    if (!file || !pendingUploadSlug) return;
    try {
      const dataUrl = await fileToDataUrl(file);
      images[pendingUploadSlug] = dataUrl;
      persistImages();
      applyImages();
      if (pendingUploadSlideIndex != null) stampEdit(pendingUploadSlideIndex);
      setEditStatus(imagesStorageOK ? SAVED_MSG() : T().savedFallback);
    } catch (err) {
      alert(T().imgFail);
    }
  });

  function resetSlide(i) {
    const src = SLIDES[i];
    if (!src) return;
    delete curEdits().slides[i];
    delete curEdits().meta[i];
    persistEdits();
    const baked = (window.__DECK_EDITS__ && window.__DECK_EDITS__[LANG] && window.__DECK_EDITS__[LANG].slides) || {};
    const inner = slideEls[i].querySelector(".slide-inner");
    if (baked[i]) inner.innerHTML = baked[i];
    else inner.innerHTML = renderSlideInner(src);
    if (Number(i) === 1) ensureInstructorPhotos();
    applyImages();
    renderStamp(i);
    if (editMode) setEditMode(true);
    else fitSlide(slideEls[i]);
  }

  function exportHtml() {
    const clone = document.documentElement.cloneNode(true);

    const holder = clone.querySelector("#deck-edits");
    const bakedKo = (window.__DECK_EDITS__ && window.__DECK_EDITS__.ko && window.__DECK_EDITS__.ko.slides) || {};
    const bakedJa = (window.__DECK_EDITS__ && window.__DECK_EDITS__.ja && window.__DECK_EDITS__.ja.slides) || {};
    const baked = {
      ko: { slides: Object.assign({}, bakedKo, edits.ko.slides || {}), meta: Object.assign({}, edits.ko.meta || {}) },
      ja: { slides: Object.assign({}, bakedJa, edits.ja.slides || {}), meta: Object.assign({}, edits.ja.meta || {}) }
    };
    holder.textContent = "window.__DECK_EDITS__ = " + JSON.stringify(baked) + ";"
      + " window.__DECK_IMAGES__ = " + JSON.stringify(images) + ";";

    // 실행 중에 만들어진 것들은 비운다 — 새로 열릴 때 다시 그려진다
    clone.querySelector("#deck").innerHTML = "";
    clone.querySelector("#tocGrid").innerHTML = "";
    clone.querySelectorAll("[contenteditable]").forEach(el => el.removeAttribute("contenteditable"));
    clone.querySelectorAll(".slide-inner[style]").forEach(el => el.removeAttribute("style"));
    clone.querySelectorAll(".lg-item.has-logo").forEach(el => el.classList.remove("has-logo"));
    const b = clone.querySelector("body");
    b.classList.remove("is-editing");
    b.querySelector(".cover") && b.querySelector(".cover").classList.remove("is-ready");

    const html = "<!DOCTYPE html>\n" + clone.outerHTML;
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "실무자가-알아야-할-AI-현황.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    setEditStatus(T().exportedMsg);
  }

  /* ── 슬라이드 자동 맞춤 ───────────────────────────────────────────
     기본 글자 크기를 크게 잡아두고, 내용이 많아 화면을 넘치는 슬라이드만
     그만큼 축소한다. 어떤 해상도에서도 스크롤 없이 한 화면에 들어간다. */
  function fitSlide(el) {
    const inner = el.querySelector(".slide-inner");
    if (!inner || el.classList.contains("cover") || el.classList.contains("divider-slide")) return;
    inner.style.zoom = "";
    const cs = getComputedStyle(el);
    const avail = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const need = inner.scrollHeight;
    if (avail > 0 && need > avail + 2) {
      inner.style.zoom = Math.max(0.72, avail / need).toFixed(3);
    }
  }

  function fitAll() { slideEls.forEach(fitSlide); }

  let fitTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(fitAll, 120);
  });

  /* 로고 파일이 있으면 워드마크를 실제 로고로 교체, 없으면 <img> 제거 */
  document.querySelectorAll(".lg-img").forEach(img => {
    const mark = () => {
      if (img.naturalWidth > 0) img.closest(".lg-item").classList.add("has-logo");
    };
    img.addEventListener("load", mark);
    if (img.complete) mark();
    // 로드 실패해도 <img>를 남겨둔다 — CSS 로 숨겨지고, 내보내기 파일에도 슬롯이 보존된다.
  });

  /* 유체 시뮬레이션 */
  let fluid = null;
  try {
    fluid = fluidSimulation(document.querySelector(".fluid-canvas"));
  } catch (error) {
    console.error("fluid simulation could not start:", error);
  }

  /* 표지 단어 리빌 */
  function splitWords(element, baseDelay, stagger) {
    if (!element) return;
    const words = element.textContent.trim().split(/\s+/);
    element.textContent = "";
    words.forEach((word, index) => {
      const span = document.createElement("span");
      span.className = "word";
      span.textContent = word;
      span.style.transitionDelay = `${baseDelay + index * stagger}ms`;
      element.appendChild(span);
      if (index < words.length - 1) element.appendChild(document.createTextNode(" "));
    });
  }
  let coverEl;
  function refreshCoverEl() {
    coverEl = deck.querySelector(".cover");
    splitWords(coverEl.querySelector("h1"), 420, 85);
    splitWords(coverEl.querySelector(".subline"), 1080, 20);
  }
  refreshCoverEl();

  /* 상태 */
  let index = 0;
  let tocOpen = false;

  function fxShouldBeLive() {
    return tocOpen || index === 0;
  }

  function syncFx() {
    const live = fxShouldBeLive();
    fx.classList.toggle("is-live", live);
    if (fluid) fluid.setActive(live);
  }

  function go(i, push = true) {
    index = Math.max(0, Math.min(TOTAL - 1, i));
    slideEls.forEach((el, n) => el.classList.toggle("is-active", n === index));

    const s = SLIDES[index];
    const ch = CHAPTERS[s.ch];
    chapterTag.innerHTML = `<i>${pad(s.ch)}</i><b>${ch.t}</b>${ch.time ? ` · ${ch.time}` : ""}`;
    curNo.textContent = pad(index + 1);
    progressBar.style.width = ((index + 1) / TOTAL * 100) + "%";
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === TOTAL - 1;

    tocGrid.querySelectorAll("button[data-go]").forEach(b =>
      b.classList.toggle("is-current", Number(b.dataset.go) === index));
    tocGrid.querySelectorAll(".toc-ch").forEach(el =>
      el.classList.toggle("is-current", Number(el.dataset.ch) === s.ch));

    if (index === 0) requestAnimationFrame(() => coverEl.classList.add("is-ready"));
    if (push) history.replaceState(null, "", "#" + (index + 1));
    applyImages();
    // 보여주기 직전에 다시 맞춘다 — 초기 측정이 실패했거나 창이 바뀌었어도 자가 복구된다
    if (!editMode) fitSlide(slideEls[index]);
    syncFx();
  }

  function setToc(open) {
    tocOpen = open;
    toc.classList.toggle("is-open", open);
    toc.setAttribute("aria-hidden", String(!open));
    deck.classList.toggle("is-veiled", open);
    syncFx();
  }

  /* 이벤트 */
  document.addEventListener("click", (e) => {
    const goBtn = e.target.closest("[data-go]");
    if (goBtn) { setToc(false); go(Number(goBtn.dataset.go)); return; }
    if (e.target.closest("[data-toc]")) { setToc(true); return; }
  });

  prevBtn.addEventListener("click", () => go(index - 1));
  function revealNext() {
    if (editMode) return false;
    const s = slideEls[index];
    if (!s) return false;
    const btn = s.querySelector(".quiz-item:not(.is-open) > .rv-btn");
    if (btn) { btn.click(); return true; }
    return false;
  }
  nextBtn.addEventListener("click", () => { if (!revealNext()) go(index + 1); });
  document.getElementById("tocBtn").addEventListener("click", () => setToc(!tocOpen));
  document.getElementById("tocClose").addEventListener("click", () => setToc(false));
  toc.addEventListener("click", (e) => { if (e.target === toc) setToc(false); });

  document.getElementById("fsBtn").addEventListener("click", toggleFullscreen);
  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }

  document.getElementById("editBtn").addEventListener("click", () => setEditMode(!editMode));
  document.getElementById("editDone").addEventListener("click", () => setEditMode(false));
  document.getElementById("editExport").addEventListener("click", exportHtml);
  document.getElementById("editReset").addEventListener("click", () => {
    if (confirm(T().confirmReset(index + 1))) resetSlide(index);
  });
  document.getElementById("editResetAll").addEventListener("click", () => {
    if (!confirm(T().confirmResetAll)) return;
    curEdits().slides = {};
    curEdits().meta = {};
    persistEdits();
    slideEls.forEach((el, i) => {
      el.querySelector(".slide-inner").innerHTML = renderSlideInner(SLIDES[i]);
    });
    applyImages();
    renderAllStamps();
    setEditMode(editMode);
    setEditStatus(T().resetDoneMsg);
  });

  /* ── 언어 전환 ────────────────────────────────────────────────── */
  function applyLangChrome() {
    const t = T();
    document.documentElement.lang = LANG;
    document.title = LANG === "ja" ? TITLE_JA : TITLE_KO;
    document.getElementById("langBtnLabel").textContent = t.langLabel;
    document.getElementById("fsBtn").title = t.fsTitle;
    document.getElementById("editBtn").title = t.editTitle;
    document.getElementById("editBtnLabel").textContent = t.editLabel;
    document.getElementById("tocBtn").title = t.tocTitle;
    document.getElementById("tocBtnLabel").textContent = t.tocLabel;
    document.getElementById("tocTitle").textContent = t.tocHeading;
    document.getElementById("tocSubPrefix").textContent = t.tocSubPrefix;
    document.getElementById("tocSubSuffix").textContent = t.tocSubSuffix;
    document.getElementById("tocCloseLabel").textContent = t.tocCloseLabel;
    prevBtn.title = t.prevTitle;
    document.getElementById("prevBtnLabel").textContent = t.prevLabel;
    nextBtn.title = t.nextTitle;
    document.getElementById("nextBtnLabel").textContent = t.nextLabel;
    document.getElementById("botbarHint").innerHTML = t.hintHtml;
    document.getElementById("editorName").placeholder = t.editorPlaceholder;
    document.getElementById("ebLabel").textContent = t.editBarLabel;
    document.getElementById("editExport").title = t.exportTitle;
    document.getElementById("editExportLabel").textContent = t.exportBtn;
    document.getElementById("editReset").title = t.resetTitle;
    document.getElementById("editResetLabel").textContent = t.resetBtn;
    document.getElementById("editResetAll").title = t.resetAllTitle;
    document.getElementById("editResetAllLabel").textContent = t.resetAllBtn;
    document.getElementById("editDoneLabel").textContent = t.doneBtn;
    setEditStatus(SAVED_MSG());
  }

  function setLang(next) {
    if (next === LANG) return;
    setEditMode(false);
    LANG = next;
    try { localStorage.setItem(LANG_KEY, LANG); } catch (e) { /* noop */ }
    SLIDES = LANG === "ja" ? SLIDES_JA : SLIDES_KO;
    CHAPTERS = LANG === "ja" ? CHAPTERS_JA : CHAPTERS_KO;
    applyLangChrome();
    buildDeck();
    buildToc();
    refreshCoverEl();
    applyEdits();
    go(index, false);
    fitAll();
  }

  document.getElementById("langBtn").addEventListener("click", () => setLang(LANG === "ja" ? "ko" : "ja"));

  const editorNameInput = document.getElementById("editorName");
  editorNameInput.value = editorName;
  editorNameInput.addEventListener("input", () => {
    editorName = editorNameInput.value;
    try { localStorage.setItem(EDITOR_KEY, editorName); } catch (e) { /* noop */ }
  });

  window.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    // 편집 중에는 방향키·스페이스가 글자 입력을 위해 그대로 동작해야 한다
    if (e.target.isContentEditable) {
      if (e.key === "Escape") { e.target.blur(); setEditMode(false); }
      return;
    }
    if (e.key === "e" || e.key === "E" || e.key === "ㄷ") { setEditMode(!editMode); return; }
    if (editMode && (e.key === " " || e.key === "Enter")) return;
    switch (e.key) {
      case "ArrowRight": case "PageDown": case " ": case "Enter":
        e.preventDefault(); if (tocOpen) setToc(false); else if (!revealNext()) go(index + 1); break;
      case "ArrowLeft": case "PageUp":
        e.preventDefault(); if (tocOpen) setToc(false); else go(index - 1); break;
      case "Home": e.preventDefault(); go(0); break;
      case "End":  e.preventDefault(); go(TOTAL - 1); break;
      case "Escape": setToc(!tocOpen); break;
      case "m": case "M": case "ㅡ": setToc(!tocOpen); break;
      case "f": case "F": case "ㄹ": toggleFullscreen(); break;
    }
  });

  /* 휠 / 스와이프로도 한 장씩 */
  let wheelLock = false;
  window.addEventListener("wheel", (e) => {
    if (tocOpen || editMode) return;
    const inner = e.target.closest(".slide-inner");
    if (inner && inner.scrollHeight > inner.clientHeight + 4) {
      const atTop = inner.scrollTop <= 0;
      const atBottom = inner.scrollTop + inner.clientHeight >= inner.scrollHeight - 1;
      if ((e.deltaY > 0 && !atBottom) || (e.deltaY < 0 && !atTop)) return;
    }
    if (wheelLock || Math.abs(e.deltaY) < 18) return;
    wheelLock = true;
    setTimeout(() => { wheelLock = false; }, 620);
    go(index + (e.deltaY > 0 ? 1 : -1));
  }, { passive: true });

  let touchY = null;
  window.addEventListener("touchstart", (e) => { touchY = e.touches[0].clientY; }, { passive: true });
  window.addEventListener("touchend", (e) => {
    if (tocOpen || editMode || touchY === null) return;
    const dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dy) > 70) go(index + (dy < 0 ? 1 : -1));
    touchY = null;
  }, { passive: true });

  /* 시작 */
  applyLangChrome();
  applyEdits();

  const fromHash = parseInt(location.hash.replace("#", ""), 10);
  go(Number.isFinite(fromHash) && fromHash >= 1 ? fromHash - 1 : 0, false);
  requestAnimationFrame(() => requestAnimationFrame(() => coverEl.classList.add("is-ready")));

  fitAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  window.addEventListener("load", fitAll);
  </script>
